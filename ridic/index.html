<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04123f">
<meta name="robots" content="noindex, nofollow">
<title>RKL Opava – evidence přeprav</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--c:#5e8aff;--ok:#3ddc97;--err:#ff6b5e;--mut:#8793ad}
  html,body{margin:0}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#1d388f;color:#e9edf7;font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);color-scheme:dark}
  body::before{content:"";position:fixed;inset:-16px;background:url(/bg.jpg) center/cover no-repeat;filter:grayscale(1) contrast(1.35) brightness(.3) blur(1px);z-index:-3}
  .hl{position:fixed;inset:-16px;z-index:-3;pointer-events:none;background:url(/bg.jpg) center/cover no-repeat;filter:grayscale(1) contrast(3.2) brightness(.85) blur(1.3px);mix-blend-mode:screen;opacity:.22}
  body::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 15% -10%,rgba(94,138,255,.35),transparent 60%),radial-gradient(700px 500px at 90% 110%,rgba(242,165,22,.18),transparent 60%),linear-gradient(160deg,rgba(0,3,20,.9),rgba(4,14,56,.86))}
  .grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(94,138,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(94,138,255,.14) 1px,transparent 1px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);background-size:48px 48px,48px 48px,auto;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 80%)}

  header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,rgba(2,6,22,.92),rgba(2,6,22,.55));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(94,138,255,.25)}
  .back{flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(94,138,255,.55);background:rgba(94,138,255,.18);color:#fff;text-decoration:none;box-shadow:0 0 14px -2px rgba(94,138,255,.5)}
  .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;line-height:1.15}
  .brand img{width:34px;height:34px;border-radius:8px;box-shadow:0 0 0 1px rgba(94,138,255,.5),0 0 16px rgba(94,138,255,.35);flex:none}
  .brand small{display:block;font-weight:400;font-size:10px;letter-spacing:2px;color:var(--mut)}
  #logout{flex:none;background:transparent;color:#cfe0ff;border:1px solid rgba(94,138,255,.55);padding:8px 12px;font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
  .panel{position:relative;background:linear-gradient(155deg,rgba(14,22,52,.88),rgba(4,8,22,.92));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(94,138,255,.5);padding:24px 20px 22px;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);box-shadow:0 0 50px rgba(94,138,255,.22);animation:arrIn .6s cubic-bezier(.2,.8,.2,1) both}
  .panel::before{content:"";position:absolute;left:0;top:0;width:72px;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
  .panel::after{content:"";position:absolute;right:0;bottom:0;width:54px;height:2px;background:var(--c);box-shadow:0 0 14px var(--c);opacity:.7}
  @keyframes arrIn{from{opacity:0;transform:translateX(40px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  @media (prefers-reduced-motion:reduce){.panel{animation:none}}

  h1{margin:0 0 4px;font-size:clamp(22px,6vw,28px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 0 28px rgba(94,138,255,.55)}
  .lead{margin:0 0 18px;color:var(--mut);font-size:12px;letter-spacing:2px;text-transform:uppercase}

  .who{font-size:14px;line-height:1.55;color:#aeb9d4}
  .who b{display:block;color:#fff;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
  .who .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .who .tags span{font:500 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1px;color:#cfe0ff;background:rgba(94,138,255,.16);border:1px solid rgba(94,138,255,.45);padding:3px 9px}

  .grp{display:flex;align-items:center;gap:10px;margin:0 0 10px;font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:3px;text-transform:uppercase;color:var(--c)}
  .grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(94,138,255,.6),transparent)}
  .grp.sp{margin-top:22px}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 6px;color:#aeb9d4}
  .row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
  .row>div{min-width:0}
  .row label{margin-top:0}
  input{width:100%;min-width:0;min-height:52px;padding:13px 12px;background:#000;border:1px solid rgba(94,138,255,.5);color:#fff;font:500 17px "IBM Plex Sans",system-ui,sans-serif;outline:0;border-radius:0;-webkit-appearance:none;appearance:none}
  input::placeholder{color:#5b6786}
  input:focus{border-color:var(--c);box-shadow:0 0 12px rgba(94,138,255,.6)}
  input.bad{border-color:var(--err);box-shadow:0 0 10px rgba(255,107,94,.45)}
  input[type=date],input[type=time]{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;padding-left:10px;padding-right:6px}
  input::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
  .unit{position:relative}
  .unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font:600 14px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1px;pointer-events:none}
  .unit input{padding-right:48px}

  .btn{display:block;width:100%;margin-top:22px;min-height:56px;padding:15px;background:#1d388f;border:1px solid var(--c);color:#fff;font:700 16px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 24px rgba(94,138,255,.35)}
  .btn:hover,.btn:active{background:#2747b8}
  .btn:disabled{opacity:.55}

  .msg{margin-top:16px;padding:12px 14px;font-size:14px;line-height:1.45;border-left:3px solid}
  .msg.err{color:var(--err);background:rgba(255,107,94,.1);border-color:var(--err)}
  .msg.ok{color:var(--ok);background:rgba(61,220,151,.1);border-color:var(--ok);font-weight:600;font-size:16px;letter-spacing:.5px}
  .done-ic{width:56px;height:56px;margin:2px 0 14px;display:block;color:var(--ok);filter:drop-shadow(0 0 12px rgba(61,220,151,.6))}
  .brand small{white-space:nowrap}
  @media (max-width:400px){header{gap:8px;padding-left:12px;padding-right:12px}.brand{font-size:12px;letter-spacing:1.5px;gap:8px}.brand small{font-size:9px;letter-spacing:1px}#logout{padding:8px 9px;letter-spacing:1px}}
  .hidden{display:none!important}
  footer{text-align:center;font-size:10px;letter-spacing:2px;opacity:.3;padding:0 0 18px;text-transform:uppercase}

  /* SVĚTLÝ MOTIV (přes den) – stejná paleta jako na rozcestníku */
  html.light body{background:#dbe6fa;color:#0f1b3d;color-scheme:light}
  html.light body::before{filter:grayscale(.55) contrast(1.05) brightness(1.12) saturate(.9) blur(2px)}
  html.light .hl{opacity:.08;mix-blend-mode:multiply;filter:grayscale(1) contrast(2) brightness(1) blur(1.3px)}
  html.light body::after{background:radial-gradient(900px 520px at 12% -10%,rgba(94,138,255,.3),transparent 62%),radial-gradient(760px 520px at 92% 110%,rgba(242,165,22,.26),transparent 62%),linear-gradient(160deg,rgba(234,241,255,.6),rgba(200,216,246,.62))}
  html.light .grid-bg{background-image:linear-gradient(rgba(47,91,214,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(47,91,214,.13) 1px,transparent 1px),repeating-linear-gradient(0deg,rgba(15,27,61,.03) 0 1px,transparent 1px 3px)}
  html.light{--c:#2f5bd6;--ok:#0f8a5a;--err:#c0392b;--mut:#51597a}
  html.light header{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(235,242,255,.7));border-bottom-color:rgba(47,91,214,.3)}
  html.light .back{background:rgba(255,255,255,.7);color:#1d388f;border-color:rgba(47,91,214,.55);box-shadow:none}
  html.light .brand{color:#12235a}
  html.light .brand img{box-shadow:0 0 0 1px rgba(47,91,214,.5)}
  html.light #logout{color:#1d388f;border-color:rgba(47,91,214,.55)}
  html.light .panel{background:linear-gradient(155deg,rgba(255,255,255,.92),rgba(226,236,255,.88));border-color:rgba(47,91,214,.55);box-shadow:0 14px 44px -14px rgba(47,91,214,.5)}
  html.light .panel::before,html.light .panel::after{box-shadow:none}
  html.light h1{color:#0f1b3d;text-shadow:0 0 26px rgba(94,138,255,.45)}
  html.light .who{color:#3d4a6e}
  html.light .who b{color:#0f1b3d}
  html.light .who .tags span{color:#1d388f;background:rgba(47,91,214,.1);border-color:rgba(47,91,214,.45)}
  html.light label{color:#3d4a6e}
  html.light input{background:#fff;color:#0f1b3d;border-color:rgba(47,91,214,.55)}
  html.light input::placeholder{color:#8a96b4}
  html.light input:focus{box-shadow:0 0 10px rgba(47,91,214,.4)}
  html.light input.bad{box-shadow:0 0 8px rgba(192,57,43,.35)}
  html.light input::-webkit-calendar-picker-indicator{filter:none;opacity:.7}
  html.light .btn{background:#2f5bd6;border-color:#2f5bd6;color:#fff;box-shadow:0 8px 22px -8px rgba(47,91,214,.7)}
  html.light .btn:hover,html.light .btn:active{background:#1d46b8}
  html.light .msg.err{background:rgba(192,57,43,.08)}
  html.light .msg.ok{background:rgba(15,138,90,.1)}
  html.light .done-ic{filter:none}
  html.light footer{color:#0f1b3d;opacity:.5}
  /* ruční přepínač motivu v hlavičce */
  .thbtn{flex:none;width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid #f2a516;background:rgba(242,165,22,.16);color:#f2a516;box-shadow:0 0 14px rgba(242,165,22,.45);cursor:pointer}
  html.light .thbtn{border-color:#2f5bd6;background:rgba(255,255,255,.7);color:#2f5bd6;box-shadow:0 2px 10px rgba(47,91,214,.25)}
  .thbtn .sun{display:none}
  html.light .thbtn .sun{display:block}
  html.light .thbtn .moon{display:none}
</style>
<script>
(function(){
  /* Automaticky: přes den světlý, v noci tmavý motiv (východ/západ slunce v Opavě). Ruční přepnutí platí do další změny den/noc. */
  var K='rkl_ridic_theme',d=document.documentElement,LAT=49.9387,LON=17.9026,R=Math.PI/180;
  function ut(day,rise){
    var N=Math.floor((Date.UTC(day.getFullYear(),day.getMonth(),day.getDate())-Date.UTC(day.getFullYear(),0,0))/864e5);
    var lh=LON/15,t=N+((rise?6:18)-lh)/24,M=0.9856*t-3.289;
    var L=(M+1.916*Math.sin(M*R)+0.020*Math.sin(2*M*R)+282.634)%360;if(L<0)L+=360;
    var RA=Math.atan(0.91764*Math.tan(L*R))/R;RA=(RA+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
    var sd=0.39782*Math.sin(L*R),cd=Math.cos(Math.asin(sd));
    var ch=(Math.cos(90.833*R)-sd*Math.sin(LAT*R))/(cd*Math.cos(LAT*R));
    if(ch>1)return rise?1e15:-1e15;if(ch<-1)return rise?-1e15:1e15;
    var H=rise?360-Math.acos(ch)/R:Math.acos(ch)/R;H/=15;
    var T=H+RA-0.06571*t-6.622,U=((T-lh)%24+24)%24;
    return Date.UTC(day.getFullYear(),day.getMonth(),day.getDate())+U*36e5;
  }
  function phase(){var n=new Date(),x=n.getTime();return (x<ut(n,true)||x>=ut(n,false))?'n':'d'}
  function ov(){try{return JSON.parse(localStorage.getItem(K)||'null')}catch(e){return null}}
  function setOv(o){try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
  function wantLight(){var o=ov(),p=phase();if(o&&o.p===p)return !!o.l;return p==='d'}
  function paint(){
    var on=wantLight();d.classList.toggle('light',on);
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',on?'#dbe6fa':'#04123f');
    var b=document.getElementById('thBtn');if(b)b.title=on?'Světlý motiv – klepnutím přepnete na tmavý':'Tmavý motiv – klepnutím přepnete na světlý';
  }
  paint();
  function init(){var b=document.getElementById('thBtn');if(b)b.onclick=function(){setOv({l:!d.classList.contains('light'),p:phase()});paint()};paint()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  setInterval(paint,60000);document.addEventListener('visibilitychange',paint);
})();
</script>
</head>
<body>
<div class="hl"></div><div class="grid-bg"></div>

<header>
  <a class="back" href="https://airkl.cz/" aria-label="Zpět na rozcestník" title="Zpět na rozcestník"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="brand"><img src="/logo.jpg" alt="RKL" width="34" height="34"><div>RKL Opava<small>Evidence přeprav</small></div></div>
  <button id="thBtn" class="thbtn" type="button" aria-label="Světlý nebo tmavý motiv"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/></svg></button>
  <button id="logout" class="hidden" type="button">Odhlásit</button>
</header>

<main>
  <!-- PŘIHLÁŠENÍ -->
  <section id="loginView" class="panel hidden">
    <h1>Řidiči</h1>
    <p class="lead">Přihlášení do evidence přeprav</p>
    <form id="loginForm" autocomplete="on" novalidate>
      <label for="prijmeni" style="margin-top:0">Příjmení</label>
      <input id="prijmeni" name="username" type="text" autocomplete="username" autocapitalize="words" required>
      <label for="pin">PIN</label>
      <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button class="btn" id="loginBtn" type="submit">Přihlásit</button>
      <div id="loginMsg" class="msg err hidden"></div>
    </form>
  </section>

  <!-- FORMULÁŘ -->
  <section id="formView" class="hidden" style="display:flex;flex-direction:column;gap:16px">
    <div class="panel who" id="who"></div>

    <form id="recForm" class="panel" novalidate>
      <h1>Nová přeprava</h1>
      <p class="lead">Vyplňte údaje a odešlete</p>

      <p class="grp">Nakládka</p>
      <div class="row">
        <div><label for="datumNakladky">Datum</label><input id="datumNakladky" type="date" required></div>
        <div><label for="casNakladky">Čas</label><input id="casNakladky" type="time" required></div>
      </div>

      <p class="grp sp">Vykládka</p>
      <div class="row">
        <div><label for="datumVykladky">Datum</label><input id="datumVykladky" type="date" required></div>
        <div><label for="casVykladky">Čas</label><input id="casVykladky" type="time" required></div>
      </div>

      <p class="grp sp">Přeprava</p>
      <label for="trasa" style="margin-top:0">Trasa</label>
      <input id="trasa" type="text" maxlength="200" placeholder="např. Opava – Praha" autocomplete="off" required>

      <label for="objednatel">Objednatel</label>
      <input id="objednatel" type="text" maxlength="120" autocomplete="off" required>

      <label for="vaha">Váha</label>
      <div class="unit"><input id="vaha" type="text" inputmode="decimal" placeholder="0" autocomplete="off" required><span>kg</span></div>

      <button class="btn" id="sendBtn" type="submit">Odeslat</button>
      <div id="recMsg" class="msg hidden"></div>
    </form>
  </section>

  <section id="doneView" class="panel hidden">
    <svg class="done-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg>
    <div class="msg ok" style="margin-top:0">Záznam byl uložen. Děkujeme.</div>
    <button class="btn" id="againBtn" type="button">Zadat další přepravu</button>
  </section>
</main>
<footer>airkl.cz · Robin Balcar</footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const views = ['loginView', 'formView', 'doneView'];
  const show = (name) => {
    views.forEach(v => $(v).classList.toggle('hidden', v !== name));
    $('logout').classList.toggle('hidden', name === 'loginView');
  };

  async function api(url, body) {
    const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    const r = await fetch(url, opt);
    let data = {};
    try { data = await r.json(); } catch (e) {}
    return { status: r.status, data };
  }

  function todayISO() {
    const d = new Date(); const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  let requestId = newId();

  function showMsg(el, text, cls) { el.textContent = text; el.className = 'msg ' + cls; }
  function clearMsg(el) { el.className = 'msg hidden'; el.textContent = ''; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function setDriver(d) {
    const tags = [d.dopravce, d.spz, d.typ].filter(Boolean).map(t => '<span>' + esc(t) + '</span>').join('');
    $('who').innerHTML = '<b>' + esc(d.jmeno + ' ' + d.prijmeni) + '</b>' + (tags ? '<div class="tags">' + tags + '</div>' : '');
  }

  function resetForm() {
    ['trasa', 'objednatel', 'vaha', 'casNakladky', 'casVykladky'].forEach(id => $(id).value = '');
    const t = todayISO();
    $('datumNakladky').value = t; $('datumVykladky').value = t;
    document.querySelectorAll('input.bad').forEach(i => i.classList.remove('bad'));
    clearMsg($('recMsg'));
    requestId = newId();
  }

  (async function init() {
    resetForm();
    const r = await api('/api/ridic/me');
    if (r.status === 200 && r.data.ok) { setDriver(r.data.driver); show('formView'); }
    else show('loginView');
  })();

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('loginMsg'); clearMsg(msg);
    const prijmeni = $('prijmeni').value.trim(), pin = $('pin').value.trim();
    if (!prijmeni || !pin) return showMsg(msg, 'Vyplňte příjmení a PIN.', 'err');
    $('loginBtn').disabled = true;
    try {
      const r = await api('/api/ridic/login', { prijmeni, pin });
      if (r.data.ok) { $('pin').value = ''; setDriver(r.data.driver); show('formView'); }
      else if (r.status === 429) showMsg(msg, 'Příliš mnoho pokusů. Zkuste to za chvíli.', 'err');
      else if (r.status === 401) showMsg(msg, 'Špatné příjmení nebo PIN.', 'err');
      else if (r.status === 503) showMsg(msg, 'Evidence ještě není zprovozněná. Kontaktujte dispečink.', 'err');
      else showMsg(msg, 'Nepodařilo se spojit s tabulkou. Zkuste to znovu.', 'err');
    } catch (err) { showMsg(msg, 'Chybí připojení k internetu.', 'err'); }
    $('loginBtn').disabled = false;
  });

  $('logout').addEventListener('click', async () => {
    await api('/api/ridic/logout', {});
    $('pin').value = ''; clearMsg($('loginMsg')); show('loginView');
  });

  const FIELDS = ['datumNakladky', 'casNakladky', 'datumVykladky', 'casVykladky', 'trasa', 'objednatel', 'vaha'];

  $('recForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('recMsg'); clearMsg(msg);
    document.querySelectorAll('input.bad').forEach(i => i.classList.remove('bad'));

    const v = {};
    FIELDS.forEach(k => v[k] = $(k).value.trim());
    const bad = FIELDS.filter(k => !v[k]);
    const w = Number(v.vaha.replace(/\s/g, '').replace(',', '.'));
    if (v.vaha && !(w > 0)) bad.push('vaha');
    if (bad.length) {
      bad.forEach(k => $(k).classList.add('bad'));
      return showMsg(msg, 'Vyplňte prosím všechna pole správně.', 'err');
    }
    if (v.datumVykladky + 'T' + v.casVykladky < v.datumNakladky + 'T' + v.casNakladky) {
      ['datumVykladky', 'casVykladky'].forEach(k => $(k).classList.add('bad'));
      return showMsg(msg, 'Vykládka nemůže být dřív než nakládka.', 'err');
    }

    $('sendBtn').disabled = true; $('sendBtn').textContent = 'Odesílám…';
    try {
      const r = await api('/api/ridic/zaznam', Object.assign({ requestId }, v));
      if (r.data.ok) show('doneView');
      else if (r.status === 401) { show('loginView'); showMsg($('loginMsg'), 'Přihlášení vypršelo. Přihlaste se znovu.', 'err'); }
      else if (r.status === 400) showMsg(msg, 'Zkontrolujte vyplněné údaje.', 'err');
      else showMsg(msg, 'Záznam se nepodařilo uložit do tabulky. Zkuste to prosím znovu.', 'err');
    } catch (err) {
      showMsg(msg, 'Chybí připojení k internetu. Údaje zůstaly vyplněné, zkuste to znovu.', 'err');
    }
    $('sendBtn').disabled = false; $('sendBtn').textContent = 'Odeslat';
  });

  $('againBtn').addEventListener('click', () => { resetForm(); show('formView'); window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
