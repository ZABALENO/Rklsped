<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RKL Opava – rozcestník</title>
<link rel="apple-touch-icon" href="/logo.jpg">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f5;--ink:#0f1b2d;--muted:#5d6b80;--line:#dbe1ea;--navy:#1d388f}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  body::before{content:"";position:fixed;inset:-24px;background:url(/bg.jpg) center 40%/cover no-repeat;filter:blur(3px) saturate(1.1);z-index:-2}
  body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(21,42,110,.45) 0,rgba(238,241,245,.62) 320px,rgba(238,241,245,.74) 700px,rgba(238,241,245,.80) 100%)}
  header{background:rgba(29,56,143,.86);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .bar{max-width:1320px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px;line-height:1.15}
  .brand .logo{width:32px;height:32px;border-radius:8px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .brand small{display:block;font-weight:400;font-size:11.5px;opacity:.75;letter-spacing:0}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1040px;width:100%;margin:0 auto;padding:24px 20px 56px}
  h1{font-size:clamp(26px,4vw,38px);margin:0 0 4px;font-weight:700;color:var(--navy)}
  p.lead{margin:0 0 28px;color:var(--ink);opacity:.8;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  a.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border-radius:10px;padding:26px 24px 22px;box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 20px rgba(15,27,45,.12);transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden;min-height:200px}
  a.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
  a.tile:hover,a.tile:focus-visible{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,27,45,.08),0 14px 34px rgba(15,27,45,.2);outline:none}
  a.tile:focus-visible{box-shadow:0 0 0 3px #f2a516,0 14px 34px rgba(15,27,45,.2)}
  .ic{width:52px;height:52px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff}
  .ic svg{width:30px;height:30px}
  .tile h2{margin:6px 0 0;font-size:24px}
  .tile p{margin:0;color:var(--muted);font-size:14.5px}
  .tile .go{margin-top:auto;font-weight:600;color:var(--c)}
  footer{padding:16px 20px;font-size:12.5px;color:var(--muted);text-align:center}
  @media (max-width:560px){.bar{padding:6px 16px}main{padding:16px 16px 40px}a.tile{min-height:0}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><img class="logo" src="/logo.jpg" alt="RKL" width="40" height="40"><div>RKL Opava<small>Rozcestník</small></div></div></div></header>
<main>
  <h1>Kam chceš jít?</h1>
  <p class="lead">Vyber si službu.</p>
  <div class="grid">
    <a class="tile" href="https://dashboard.airkl.cz" style="--c:#1d388f">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
      <h2>Doprava</h2>
      <p>Vozidla, trasy a přepravy – přehled pro dispečink a TV.</p>
      <span class="go">Otevřít →</span>
    </a>
    <a class="tile" href="https://rklspedice.onrender.com" style="--c:#16834a">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <h2>Spedice</h2>
      <p>Přepravy k vyřízení – Západ 1, Vnitro 1 a Vnitro 2.</p>
      <span class="go">Otevřít →</span>
    </a>
    <a class="tile" href="https://dashboard.airkl.cz/ai" style="--c:#f2a516">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M21 5h-4"/></svg></span>
      <h2>AI</h2>
      <p>Zadávání objednávek AI agenty – počty, trendy a přehled.</p>
      <span class="go">Otevřít →</span>
    </a>
  </div>
</main>
<footer>airkl.cz</footer>
</body>
</html>
