<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – přihlášení</title><link rel="icon" type="image/png" href="/favicon.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070f;color:#f2f5ff;font:16px system-ui,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:rgba(8,14,34,.9);border:1px solid rgba(120,160,255,.4);padding:26px;border-radius:6px}h1{margin:0 0 14px;font-size:18px;letter-spacing:2px;text-transform:uppercase}
input,button{width:100%;padding:12px;font-size:16px;border-radius:4px;border:1px solid rgba(120,160,255,.5);background:#000;color:#fff}button{margin-top:10px;background:#1d388f;font-weight:700;cursor:pointer}.e{color:#ff6b5e;min-height:20px;margin-top:8px;font-size:14px}</style></head>
<body><form id="f"><h1>Admin – dozor</h1><input type="password" id="pw" placeholder="Admin heslo" autofocus><button>Vstoupit</button><div class="e" id="e"></div></form>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/ai/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok)location.reload();else{const j=await r.json().catch(()=>({}));document.getElementById('e').textContent=j.error||'Chyba';}};</script></body></html>
