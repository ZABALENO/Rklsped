<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS – přihlášení</title><link rel="icon" type="image/png" href="/favicon.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1230;color:#e9edf7;font:16px/1.4 system-ui,sans-serif;padding:16px}
body::before{content:"";position:fixed;inset:0;background:url(/bg.jpg) center/cover no-repeat;filter:grayscale(1) contrast(1.3) brightness(.45);z-index:-2}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(0,6,34,.8),rgba(8,24,86,.7))}
form{width:100%;max-width:380px;background:rgba(6,10,24,.85);border:1px solid rgba(94,138,255,.5);padding:30px 26px;box-shadow:0 0 50px rgba(94,138,255,.3);border-radius:6px}
img{width:48px;height:48px;border-radius:10px;display:block;margin-bottom:14px}h1{margin:0 0 4px;font-size:22px;letter-spacing:3px}p{margin:0 0 18px;color:#8793ad;font-size:13px}
input{width:100%;padding:14px;background:#000;border:1px solid rgba(94,138,255,.5);color:#fff;font-size:17px;border-radius:4px}
button{margin-top:12px;width:100%;padding:14px;background:#1d388f;border:1px solid #5e8aff;color:#fff;font-weight:700;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:4px}
.e{color:#ff6b5e;min-height:22px;margin-top:10px;font-size:14px}.back{display:block;margin-top:16px;text-align:center;color:#8793ad;font-size:13px;text-decoration:none}</style></head><body>
<form id="f"><img src="/logo.jpg" alt="RKL"><h1>GPS</h1><p>Polohy vozidel RKL</p>
<input type="password" id="pw" placeholder="Heslo" autocomplete="current-password" autofocus><button>VSTOUPIT</button><div class="e" id="e"></div><a class="back" href="https://airkl.cz/">← zpět na rozcestník</a></form>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/polohy/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
if(r.ok)location.href='/polohy';else{const j=await r.json().catch(()=>({}));document.getElementById('e').textContent=j.error||'Chyba';}};</script></body></html>
