<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS – polohy vozidel</title><link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;flex-direction:column;background:#0a1230;color:#e9edf7;font:15px/1.35 system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0d1a4a;border-bottom:1px solid rgba(94,138,255,.4);flex:none}
header h1{margin:0;font-size:18px;letter-spacing:2px}header .sp{flex:1}.st{font-size:12px;color:#9aa6c2}.st.bad{color:#ff8a7a}
a.btn,button.btn{background:rgba(94,138,255,.2);border:1px solid rgba(94,138,255,.55);color:#fff;border-radius:8px;padding:7px 12px;text-decoration:none;font:inherit;font-size:13px;cursor:pointer}
a.btn:hover,button.btn:hover{background:rgba(94,138,255,.4)}
main{flex:1;display:flex;min-height:0}#side{width:340px;max-width:42%;display:flex;flex-direction:column;border-right:1px solid rgba(94,138,255,.3);background:#0b1538;min-height:0}
#tools{padding:10px;display:flex;flex-direction:column;gap:8px;flex:none}#q{width:100%;padding:10px;background:#000;border:1px solid rgba(94,138,255,.5);color:#fff;border-radius:6px;font-size:15px}
label{font-size:13px;color:#b8c2dc;display:flex;gap:6px;align-items:center}#cnt{font-size:12px;color:#9aa6c2}
#list{overflow:auto;flex:1}.row{padding:9px 12px;border-bottom:1px solid rgba(94,138,255,.15);cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:center}
.row:hover{background:rgba(94,138,255,.15)}.dot{width:11px;height:11px;border-radius:50%;grid-row:1/3}.row b{font-size:15px}.row small{color:#9aa6c2;font-size:12px}.row .sp{text-align:right;font-weight:600}
#map{flex:1;min-width:0}.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif;color:#10183a}
@media(max-width:760px){main{flex-direction:column}#side{width:100%;max-width:none;height:38%;order:2;border-right:0;border-top:1px solid rgba(94,138,255,.3)}#map{order:1}header h1{font-size:16px}}
</style></head><body>
<header><a class="btn" id="bk" href="https://airkl.cz/" title="Zpět">←</a><h1>GPS</h1><span class="st" id="st">načítám…</span><span class="sp"></span><button class="btn" id="rf">Obnovit</button><a class="btn" href="/polohy/logout">Odhlásit</a></header>
<main><div id="side"><div id="tools"><input id="q" placeholder="Hledat SPZ, řidiče, skupinu…" autocomplete="off">
<label><input type="checkbox" id="mv"> jen vozidla v pohybu</label><label><input type="checkbox" id="old" checked> skrýt vozidla bez signálu přes 7 dní</label><div id="cnt"></div></div><div id="list"></div></div><div id="map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const map=L.map('map').setView([49.94,17.9],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let cars=[],first=true,markers={};
const ageMin=c=>c.time?(Date.now()-new Date(c.time))/6e4:1e9;
const colorOf=c=>{const a=ageMin(c);return a>1440?'#7d869e':c.speed>0&&a<60?'#2ee08a':'#5e8aff'};
function ago(c){const a=ageMin(c);if(a>1e8)return'bez údaje';if(a<1)return'právě teď';if(a<60)return'před '+Math.round(a)+' min';if(a<1440)return'před '+Math.round(a/60)+' h';return'před '+Math.round(a/1440)+' dny'}
function when(c){return c.time?new Date(c.time).toLocaleString('cs-CZ',{timeZone:'Europe/Prague'}):''}
function visible(){const q=$('q').value.trim().toLowerCase(),mv=$('mv').checked,old=$('old').checked;
return cars.filter(c=>(!old||ageMin(c)<=7*1440)&&(!mv||(c.speed>0&&ageMin(c)<60))&&(!q||[c.spz,c.driver,c.group,c.trailer,c.place].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.spz.localeCompare(b.spz))}
function popup(c){return'<b>'+esc(c.spz)+'</b>'+(c.group?' · '+esc(c.group):'')+'<br>'+(c.driver?esc(c.driver)+'<br>':'')+'Rychlost: '+c.speed+' km/h<br>'+(c.place?esc((c.country?c.country+' – ':'')+c.place)+'<br>':'')+(c.trailer?'Návěs: '+esc(c.trailer)+'<br>':'')+'<small>'+esc(when(c))+' ('+ago(c)+')</small>'}
function render(){const v=visible();layer.clearLayers();markers={};
$('cnt').textContent='Zobrazeno '+v.length+' z '+cars.length+' vozidel';
$('list').innerHTML=v.map(c=>'<div class="row" data-s="'+esc(c.spz)+'"><span class="dot" style="background:'+colorOf(c)+'"></span><b>'+esc(c.spz)+'</b><span class="sp">'+(c.speed>0&&ageMin(c)<60?c.speed+' km/h':'')+'</span><small>'+esc(c.driver||c.group||'')+(c.place?' · '+esc(c.place):'')+'</small><small style="text-align:right">'+ago(c)+'</small></div>').join('');
for(const c of v){const m=L.circleMarker([c.lat,c.lon],{radius:7,color:'#fff',weight:1.5,fillColor:colorOf(c),fillOpacity:.95}).bindPopup(popup(c)).bindTooltip(c.spz,{direction:'top',offset:[0,-6]});m.addTo(layer);markers[c.spz]=m}
if(first&&v.length){map.fitBounds(L.latLngBounds(v.filter(c=>ageMin(c)<1440).map(c=>[c.lat,c.lon]).concat([[49.94,17.9]])).pad(.1));first=false}}
$('list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const m=markers[r.dataset.s];if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),12));m.openPopup()}};
['q','mv','old'].forEach(i=>$(i).oninput=render);
async function load(){try{const r=await fetch('/api/polohy');if(r.status===401){location.reload();return}const j=await r.json();
if(!r.ok){$('st').textContent='Chyba: '+(j.error||r.status);$('st').className='st bad';return}
cars=j.cars;render();$('st').textContent='aktualizováno '+new Date(j.fetchedAt).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague'})+(j.stale?' – POZOR: '+j.error:'');$('st').className='st'+(j.stale?' bad':'')}
catch(e){$('st').textContent='Nelze načíst data';$('st').className='st bad'}}
$('bk').onclick=e=>{if(document.referrer&&history.length>1){e.preventDefault();history.back()}};
$('rf').onclick=load;load();setInterval(load,30000);
</script></body></html>
