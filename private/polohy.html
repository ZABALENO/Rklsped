<header><a class="btn" id="bk" href="https://airkl.cz/" title="Zpět">←</a><h1>GPS</h1><span class="st" id="st">načítám…</span><span class="sp"></span><button class="btn" id="rf">Obnovit</button><a class="btn" href="/polohy/logout">Odhlásit</a></header>

 <div id="rres" class="card" hidden><div class="rowbtns"><button class="btn" id="rcsv">Stáhnout do Excelu (CSV)</button></div><div class="tw"><table class="t" id="rtab"></table></div></div>
</div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const map=L.map('map').setView([49.94,17.9],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let cars=[],first=true,markers={},me=null,meMarker=null,meCircle=null,watchId=null,lastRender=0;
const ageMin=c=>c.time?(Date.now()-new Date(c.time))/6e4:1e9;
const colorOf=c=>{const a=ageMin(c);return a>1440?'#7d869e':c.speed>0&&a<60?'#2ee08a':'#5e8aff'};
function ago(c){const a=ageMin(c);if(a>1e8)return'bez údaje';if(a<1)return'právě teď';if(a<60)return'před '+Math.round(a)+' min';if(a<1440)return'před '+Math.round(a/60)+' h';return'před '+Math.round(a/1440)+' dny'}
function when(c){return c.time?new Date(c.time).toLocaleString('cs-CZ',{timeZone:'Europe/Prague'}):''}
const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const dOf=c=>me?km(me.lat,me.lon,c.lat,c.lon):null;
const fk=d=>d==null?'':(d<10?d.toFixed(1):Math.round(d)).toString().replace('.',',')+' km';
function visible(){const q=$('q').value.trim().toLowerCase(),mv=$('mv').checked,old=$('old').checked;
return cars.filter(c=>(!old||ageMin(c)<=7*1440)&&(!mv||(c.speed>0&&ageMin(c)<60))&&(!q||[c.spz,c.driver,c.group,c.trailer,c.place].join(' ').toLowerCase().includes(q))).sort((a,b)=>me&&$('folc').checked?dOf(a)-dOf(b):a.spz.localeCompare(b.spz))}
function popup(c){return'<b>'+esc(c.spz)+'</b>'+(c.group?' · '+esc(c.group):'')+'<br>'+(c.driver?esc(c.driver)+'<br>':'')+'Rychlost: '+c.speed+' km/h<br>'+(c.place?esc((c.country?c.country+' – ':'')+c.place)+'<br>':'')+(c.trailer?'Návěs: '+esc(c.trailer)+'<br>':'')+'<a href="#" class="hl" data-id="'+c.id+'" data-spz="'+esc(c.spz)+'">Historie vozidla ›</a><br>'+(me?'Vzdálenost od vás: <b>'+fk(dOf(c))+'</b><br>':'')+'<small>'+esc(when(c))+' ('+ago(c)+')</small>'}
function render(){lastRender=Date.now();const v=visible();layer.clearLayers();markers={};
$('cnt').textContent='Zobrazeno '+v.length+' z '+cars.length+' vozidel';
$('list').innerHTML=v.map(c=>'<div class="row" data-s="'+esc(c.spz)+'"><span class="dot" style="background:'+colorOf(c)+'"></span><b>'+esc(c.spz)+'</b><span class="sp">'+(c.speed>0&&ageMin(c)<60?c.speed+' km/h':'')+'</span><small>'+(me?'<span class="dist">'+fk(dOf(c))+'</span> · ':'')+esc(c.driver||c.group||'')+(c.place?' · '+esc(c.place):'')+'</small><small style="text-align:right">'+ago(c)+'</small></div>').join('');
for(const c of v){const m=L.circleMarker([c.lat,c.lon],{radius:7,color:'#fff',weight:1.5,fillColor:colorOf(c),fillOpacity:.95}).bindPopup(popup(c)).bindTooltip(c.spz,{direction:'top',offset:[0,-6]});m.addTo(layer);markers[c.spz]=m}
if(first&&v.length){map.fitBounds(L.latLngBounds(v.filter(c=>ageMin(c)<1440).map(c=>[c.lat,c.lon]).concat([[49.94,17.9]])).pad(.1),{paddingBottomRight:[0,mq.matches?Math.round(H()*.45):0]});first=false}}
$('list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;peek();const m=markers[r.dataset.s];if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),12));m.openPopup()}};

/* ---- spodní panel se seznamem na telefonu: tažením nahoru zakryje mapu, dolů ji odkryje ---- */
const mq=window.matchMedia('(max-width:760px)'),side=$('side'),main0=document.querySelector('main');
const PEEK=96,H=()=>main0.clientHeight,states=()=>[PEEK,Math.round(H()*.45),H()];
function setH(px,anim){if(!mq.matches)return;document.body.classList.toggle('drag',!anim);side.style.height=Math.max(PEEK,Math.min(H(),px))+'px'}
function snapTo(start,cur){const st=states(),d=cur-start;let t;
 if(d>30)t=st.find(x=>x>start+10)||st[2];else if(d<-30)t=[...st].reverse().find(x=>x<start-10)||st[0];else t=st.reduce((a,b)=>Math.abs(b-cur)<Math.abs(a-cur)?b:a);
 document.body.classList.remove('drag');side.style.height=t+'px'}
function peek(){if(mq.matches){document.body.classList.remove('drag');side.style.height=PEEK+'px'}}
let drag=null;
function dragStart(y){drag={y,h:side.offsetHeight,moved:false}}
function dragMove(y){if(!drag)return;const dy=drag.y-y;if(Math.abs(dy)>4)drag.moved=true;setH(drag.h+dy,false)}
function dragEnd(){if(!drag)return;const d=drag;drag=null;if(d.moved)snapTo(d.h,side.offsetHeight);else{document.body.classList.remove('drag');const st=states();side.style.height=(side.offsetHeight<=PEEK+5?st[1]:st[0])+'px'}}
for(const el of [$('grab'),$('tools')]){
 el.addEventListener('pointerdown',e=>{if(!mq.matches||e.target.closest('input,label'))return;el.setPointerCapture(e.pointerId);dragStart(e.clientY)});
 el.addEventListener('pointermove',e=>dragMove(e.clientY));
 el.addEventListener('pointerup',dragEnd);el.addEventListener('pointercancel',dragEnd)}
{const L0=$('list');let ty=0,th=0,on=false;
 L0.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;th=side.offsetHeight;on=false},{passive:true});
 L0.addEventListener('touchmove',e=>{if(!mq.matches)return;const dy=e.touches[0].clientY-ty;
  if(on||(dy>6&&L0.scrollTop<=0)||(dy<-6&&side.offsetHeight<H()-2)){if(!on){on=true;drag={y:ty,h:th,moved:true}}e.preventDefault();setH(th-dy,false)}},{passive:false});
 L0.addEventListener('touchend',()=>{if(on){on=false;const d=drag;drag=null;snapTo(d.h,side.offsetHeight)}})}
window.addEventListener('resize',()=>{if(!mq.matches){side.style.height='';document.body.classList.remove('drag')}map.invalidateSize()});
['q','mv','old'].forEach(i=>$(i).oninput=render);
async function load(){try{const r=await fetch('/api/polohy');if(r.status===401){location.reload();return}const j=await r.json();
if(!r.ok){$('st').textContent='Chyba: '+(j.error||r.status);$('st').className='st bad';return}
cars=j.cars;render();$('st').textContent='aktualizováno '+new Date(j.fetchedAt).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague'})+(j.stale?' – POZOR: '+j.error:'');$('st').className='st'+(j.stale?' bad':'')}
catch(e){$('st').textContent='Nelze načíst data';$('st').className='st bad'}}
$('bk').onclick=e=>{if(document.referrer&&history.length>1){e.preventDefault();history.back()}};

const LocCtl=L.Control.extend({options:{position:'topleft'},onAdd(){const d=L.DomUtil.create('div','leaflet-bar');const a=L.DomUtil.create('a','loc',d);a.href='#';a.id='locBtn';a.title='Moje poloha';a.setAttribute('aria-label','Moje poloha');
a.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>';
L.DomEvent.disableClickPropagation(d);L.DomEvent.on(a,'click',e=>{L.DomEvent.preventDefault(e);toggleLoc()});return d}});
new LocCtl().addTo(map);
function stopLoc(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null}if(meCircle){map.removeLayer(meCircle);meCircle=null}$('locBtn').classList.remove('on');$('fol').classList.remove('show');render()}
function toggleLoc(){
 if(watchId!=null){stopLoc();return}
 if(!navigator.geolocation){alert('Tento prohlížeč neumí zjistit polohu.');return}
 $('locBtn').classList.add('on');$('folc').checked=true;let firstFix=true;
 watchId=navigator.geolocation.watchPosition(p=>{
  me={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
  if(!meMarker){meMarker=L.marker([me.lat,me.lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]}),zIndexOffset:1000,interactive:false}).addTo(map);meCircle=L.circle([me.lat,me.lon],{radius:me.acc,color:'#1a73e8',weight:1,fillOpacity:.1,interactive:false}).addTo(map)}
  else{meMarker.setLatLng([me.lat,me.lon]);meCircle.setLatLng([me.lat,me.lon]).setRadius(me.acc)}
  $('fol').classList.add('show');
  if(firstFix){firstFix=false;map.setView([me.lat,me.lon],Math.max(map.getZoom(),11));render()}
  else{if($('folc').checked)map.panTo([me.lat,me.lon]);if(Date.now()-lastRender>10000)render()}
 },e=>{stopLoc();alert(e.code===1?'Poloha není povolena. Povolte ji v nastavení prohlížeče pro tuto stránku.':'Polohu se nepodařilo zjistit.')},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
map.on('dragstart',()=>{$('folc').checked=false});
$('folc').onchange=render;
$('rf').onclick=load;load();setInterval(load,30000);
</script>
<script>
/* ===== záložky Mapa / Historie / Reporty ===== */
const fmtH=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' h'};
const fmtKm=k=>k==null?'–':Math.round(k).toLocaleString('cs-CZ')+' km';
const tz='Europe/Prague',fmtDT=iso=>new Date(iso).toLocaleString('cs-CZ',{timeZone:tz,day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtT=iso=>new Date(iso).toLocaleTimeString('cs-CZ',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
const fmtD=k=>{const [y,m,d]=k.split('-');return +d+'. '+ +m+'. '+y};
let hmap=null,hlayer=null,hpts=[];
function showView(v){document.body.dataset.v=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='map')setTimeout(()=>map.invalidateSize(),50);if(v==='hist'&&hmap)setTimeout(()=>hmap.invalidateSize(),50);if(v==='hist'||v==='rep')fillCars()}
document.body.dataset.v='map';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
const loc=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())};
function range(p){const n=new Date(),sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),dd=(d,k)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+k),end=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59);
 const mon=sod(dd(n,-((n.getDay()+6)%7)));
 if(p==='today')return[sod(n),n];if(p==='yesterday')return[dd(sod(n),-1),end(dd(n,-1))];if(p==='week')return[mon,n];
 if(p==='lastweek')return[dd(mon,-7),end(dd(mon,-1))];if(p==='month')return[new Date(n.getFullYear(),n.getMonth(),1),n];
 if(p==='lastmonth')return[new Date(n.getFullYear(),n.getMonth()-1,1),end(new Date(n.getFullYear(),n.getMonth(),0))];return null}
function getRange(pre,f,t){if(pre.value==='custom'){if(!f.value||!t.value)throw new Error('Vyplňte období od–do.');return[f.value,t.value]}const r=range(pre.value);return[loc(r[0]),loc(r[1])]}
$('hpre').onchange=()=>$('hcust').hidden=$('hpre').value!=='custom';$('rpre').onchange=()=>$('rcust').hidden=$('rpre').value!=='custom';
function usable(){return cars.filter(c=>c.id&&ageMin(c)<=30*1440).sort((a,b)=>a.spz.localeCompare(b.spz))}
function fillCars(){const u=usable();$('carlist').innerHTML=u.map(c=>'<option value="'+esc(c.spz)+'">'+esc([c.group,c.driver].filter(Boolean).join(' · '))+'</option>').join('');drawRepCars()}
const carBySpz=v=>{v=String(v||'').trim().toLowerCase();return cars.find(c=>c.spz.toLowerCase()===v)};
async function api(url){const r=await fetch(url);let j={};try{j=await r.json()}catch{}if(r.status===401){location.reload();throw new Error('Přihlášení vypršelo.')}if(!r.ok)throw new Error(j.error||('Chyba '+r.status));return j}

/* ===== Historie ===== */
function ensureHmap(){if(hmap)return;hmap=L.map('hmap').setView([49.94,17.9],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(hmap);hlayer=L.layerGroup().addTo(hmap)}
function dot(c,sz){return L.divIcon({className:'',html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+';border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}
async function runHist(){
 const msg=$('hmsg');msg.className='msg';const c=carBySpz($('hcar').value);
 if(!c){msg.textContent='Vyberte vozidlo ze seznamu (podle SPZ).';msg.className='msg bad';return}
 let r;try{r=getRange($('hpre'),$('hf'),$('ht'))}catch(e){msg.textContent=e.message;msg.className='msg bad';return}
 $('hgo').disabled=true;msg.textContent='Načítám historii… (několik sekund)';
 try{const j=await api('/api/polohy/historie?car='+c.id+'&from='+encodeURIComponent(r[0])+'&to='+encodeURIComponent(r[1]));renderHist(c,j);msg.textContent=''}
 catch(e){msg.textContent=e.message;msg.className='msg bad'}finally{$('hgo').disabled=false}}
function renderHist(c,j){
 const s=j.summary,t=s.total;$('hres').hidden=false;ensureHmap();setTimeout(()=>hmap.invalidateSize(),50);hlayer.clearLayers();hpts=j.points||[];
 $('hk').innerHTML=[['Ujeto',fmtKm(t.km)],['Doba jízdy',fmtH(t.driveMs)],['Doba stání',fmtH(t.stopMs)],['Max. rychlost',t.maxSpeed+' km/h'],['Státy',(t.countries||[]).join(', ')||'–'],['Řidič',(t.drivers||[]).join(', ')||'–']].map(x=>'<div class="kpi"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join('');
 if(hpts.length){const ll=hpts.map(p=>[p[0],p[1]]);L.polyline(ll,{color:'#2e7dff',weight:4,opacity:.85}).addTo(hlayer);
  L.marker(ll[0],{icon:dot('#2ee08a',16)}).bindTooltip('Začátek').addTo(hlayer);L.marker(ll[ll.length-1],{icon:dot('#ff5a4d',16)}).bindTooltip('Konec / poslední poloha').addTo(hlayer);
  for(const st of s.stops){if(st.lat==null)continue;L.marker([st.lat,st.lon],{icon:dot('#f2a516',13)}).bindPopup('<b>'+esc(st.place||'Zastávka')+'</b><br>'+fmtDT(st.from)+' – '+fmtDT(st.to)+'<br>Stání: '+fmtH(st.durMs)).addTo(hlayer)}
  hmap.fitBounds(L.latLngBounds(ll).pad(.1))}else{hmap.setView([c.lat,c.lon],10)}
 const ev=[...s.trips.map(x=>({k:'t',x,at:x.from})),...s.stops.map(x=>({k:'s',x,at:x.from}))].sort((a,b)=>a.at<b.at?-1:1);
 $('hev').innerHTML=ev.length?ev.map((e,i)=>e.k==='t'?'<div class="ev" data-i="'+i+'"><span class="ic">🚚</span><b>'+esc(e.x.fromPlace||'?')+' → '+esc(e.x.toPlace||'?')+'</b><span class="r">'+fmtKm(e.x.km)+'</span><small>'+fmtDT(e.x.from)+' – '+fmtT(e.x.to)+' · max '+e.x.maxSpeed+' km/h'+(e.x.open?' · jede':'')+'</small></div>':'<div class="ev" data-i="'+i+'"><span class="ic">🅿️</span><b>'+esc(e.x.place||'Zastávka')+(e.x.country?' ('+esc(e.x.country)+')':'')+'</b><span class="r">'+fmtH(e.x.durMs)+'</span><small>'+fmtDT(e.x.from)+' – '+(e.x.open?'dosud':fmtT(e.x.to))+'</small></div>').join(''):'<div class="msg">V tomto období nejsou žádné záznamy.</div>';
 $('hev').onclick=e=>{const el=e.target.closest('.ev');if(!el)return;const x=ev[+el.dataset.i];hmap.invalidateSize();
  if(x.k==='s'&&x.x.lat!=null){hmap.setView([x.x.lat,x.x.lon],14)}else if(x.k==='t'){const a=Date.parse(x.x.from),b=Date.parse(x.x.to),pp=hpts.filter(p=>p[2]>=a&&p[2]<=b).map(p=>[p[0],p[1]]);if(pp.length)hmap.fitBounds(L.latLngBounds(pp).pad(.15))}
  $('hmap').scrollIntoView({behavior:'smooth',block:'center'})};
 $('hdays').innerHTML='<tr><th>Den</th><th class="n">Km</th><th class="n">Jízda</th><th class="n">Stání</th><th class="n">Max</th><th>Státy</th></tr>'+s.days.map(d=>'<tr><td>'+fmtD(d.day)+'</td><td class="n">'+fmtKm(d.km)+'</td><td class="n">'+fmtH(d.driveMs)+'</td><td class="n">'+fmtH(d.stopMs)+'</td><td class="n">'+d.maxSpeed+'</td><td>'+esc(d.countries.join(', '))+'</td></tr>').join('');
 const rows=j.rows||[],cut=rows.slice(-600).reverse();
 $('hrows').innerHTML='<tr><th>Čas</th><th>Stát</th><th>Místo</th><th class="n">km/h</th><th>Řidič</th><th>Návěs</th><th class="n">Tachometr</th></tr>'+cut.map(r=>'<tr><td>'+fmtDT(r.t)+'</td><td>'+esc(r.country)+'</td><td>'+esc(r.place)+'</td><td class="n">'+r.speed+'</td><td>'+esc(r.driver)+'</td><td>'+esc(r.trailer)+'</td><td class="n">'+(r.odo==null?'':r.odo)+'</td></tr>').join('')+(rows.length>cut.length?'<tr><td colspan="7">Zobrazeno posledních '+cut.length+' z '+rows.length+' záznamů.</td></tr>':'')}
$('hgo').onclick=runHist;
document.addEventListener('click',e=>{const a=e.target.closest('a.hl');if(!a)return;e.preventDefault();map.closePopup();$('hcar').value=a.dataset.spz;$('hpre').value='today';$('hcust').hidden=true;showView('hist');runHist()});

/* ===== Reporty ===== */
let repSel=new Set(),repData=null;
function drawRepCars(){const q=$('rq').value.trim().toLowerCase();const u=usable().filter(c=>!q||[c.spz,c.group,c.driver].join(' ').toLowerCase().includes(q));
 $('rcars').innerHTML=u.map(c=>'<label><input type="checkbox" data-id="'+c.id+'"'+(repSel.has(c.id)?' checked':'')+'> <span><b>'+esc(c.spz)+'</b> <small style="color:#9aa6c2">'+esc([c.group,c.driver].filter(Boolean).join(' · '))+'</small></span></label>').join('')||'<div class="msg">Žádná vozidla.</div>';
 $('rcnt').textContent='Vybráno '+repSel.size+' vozidel'+(repSel.size>30?' (nejvýše 30 najednou)':'')}
$('rq').oninput=drawRepCars;
$('rcars').onchange=e=>{const i=+e.target.dataset.id;if(e.target.checked)repSel.add(i);else repSel.delete(i);$('rcnt').textContent='Vybráno '+repSel.size+' vozidel'+(repSel.size>30?' (nejvýše 30 najednou)':'')};
$('rall').onclick=()=>{$('rcars').querySelectorAll('input').forEach(i=>{i.checked=true;repSel.add(+i.dataset.id)});drawRepCars()};
$('rnone').onclick=()=>{repSel.clear();drawRepCars()};
async function runRep(){
 const msg=$('rmsg');msg.className='msg';const ids=[...repSel];
 if(!ids.length){msg.textContent='Vyberte aspoň jedno vozidlo.';msg.className='msg bad';return}
 if(ids.length>30){msg.textContent='Vyberte nejvýše 30 vozidel.';msg.className='msg bad';return}
 let r;try{r=getRange($('rpre'),$('rf'),$('rt'))}catch(e){msg.textContent=e.message;msg.className='msg bad';return}
 $('rgo').disabled=true;const out=[];let fail=0;
 for(let i=0;i<ids.length;i++){const c=cars.find(x=>x.id===ids[i]);msg.textContent='Zpracovávám '+(i+1)+' / '+ids.length+': '+(c?c.spz:ids[i])+'…';
  try{const j=await api('/api/polohy/historie?light=1&car='+ids[i]+'&from='+encodeURIComponent(r[0])+'&to='+encodeURIComponent(r[1]));out.push({c,s:j.summary})}catch(e){fail++;out.push({c,err:e.message})}}
 repData={r,out};renderRep();msg.textContent=fail?('Hotovo, '+fail+' vozidel se nepodařilo načíst.'):'Hotovo.';if(fail)msg.className='msg bad';$('rgo').disabled=false}
function renderRep(){
 const {out}=repData;$('rres').hidden=false;let tk=0,td=0,ts=0;
 let h='<tr><th>Vozidlo</th><th class="n">Km</th><th class="n">Jízda</th><th class="n">Stání</th><th class="n">Max</th><th>Státy</th><th>Řidiči</th></tr>';
 out.forEach((o,i)=>{if(o.err){h+='<tr><td>'+esc(o.c?o.c.spz:'?')+'</td><td colspan="6" style="color:#ff8a7a">'+esc(o.err)+'</td></tr>';return}
  const t=o.s.total;tk+=t.km;td+=t.driveMs;ts+=t.stopMs;
  h+='<tr class="car" data-i="'+i+'"><td><b>'+esc(o.c.spz)+'</b><br><small style="color:#9aa6c2">'+esc(o.c.group||'')+'</small></td><td class="n">'+fmtKm(t.km)+'</td><td class="n">'+fmtH(t.driveMs)+'</td><td class="n">'+fmtH(t.stopMs)+'</td><td class="n">'+t.maxSpeed+'</td><td>'+esc(t.countries.join(', '))+'</td><td>'+esc(t.drivers.join(', '))+'</td></tr>'
  +o.s.days.map(d=>'<tr class="day" data-p="'+i+'" hidden><td>'+fmtD(d.day)+'</td><td class="n">'+fmtKm(d.km)+'</td><td class="n">'+fmtH(d.driveMs)+'</td><td class="n">'+fmtH(d.stopMs)+'</td><td class="n">'+d.maxSpeed+'</td><td>'+esc(d.countries.join(', '))+'</td><td>'+esc(d.drivers.join(', '))+'</td></tr>').join('')});
 h+='<tr class="tot"><td>Celkem</td><td class="n">'+fmtKm(tk)+'</td><td class="n">'+fmtH(td)+'</td><td class="n">'+fmtH(ts)+'</td><td></td><td></td><td></td></tr>';
 $('rtab').innerHTML=h;$('rtab').onclick=e=>{const tr=e.target.closest('tr.car');if(!tr)return;$('rtab').querySelectorAll('tr.day[data-p="'+tr.dataset.i+'"]').forEach(x=>x.hidden=!x.hidden)}}
const csvq=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
$('rcsv').onclick=()=>{if(!repData)return;const L2=[['SPZ','Skupina','Datum','Km','Jízda (h)','Stání (h)','Max km/h','Státy','Řidiči']];
 for(const o of repData.out){if(o.err)continue;const t=o.s.total,h=ms=>(ms/36e5).toFixed(2).replace('.',',');L2.push([o.c.spz,o.c.group||'','CELKEM',Math.round(t.km),h(t.driveMs),h(t.stopMs),t.maxSpeed,t.countries.join(' '),t.drivers.join(', ')]);
  for(const d of o.s.days)L2.push([o.c.spz,o.c.group||'',d.day,Math.round(d.km),h(d.driveMs),h(d.stopMs),d.maxSpeed,d.countries.join(' '),d.drivers.join(', ')])}
 const blob=new Blob(['﻿'+L2.map(r=>r.map(csvq).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gps-report-'+repData.r[0].slice(0,10)+'_'+repData.r[1].slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
$('rgo').onclick=runRep;
</script>
</body></html>
