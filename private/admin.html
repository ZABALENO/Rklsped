<style>
:root{--bg:#02040b;--panel:rgba(12,20,44,.62);--panel2:rgba(20,32,66,.7);--line:rgba(70,190,255,.22);--tx:#e9f4ff;--mut:#7f96c2;--g:#2dffb0;--o:#ffb02e;--r:#ff3b5c;--acc:#22e1ff;--mag:#b24bff;--ui:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;--rad:8px;--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;--glow:0 0 14px}
:root[data-skin=day]{--bg:#e9f0fb;--panel:rgba(255,255,255,.78);--panel2:rgba(255,255,255,.9);--line:rgba(20,80,180,.22);--tx:#0b1630;--mut:#4f5f86;--g:#08915a;--o:#b36b00;--r:#d3173f;--acc:#0a6fd6;--mag:#7a2bd0;--glow:0 0 0}
*{box-sizing:border-box}html,body{margin:0}html{background:var(--bg)}
body{color:var(--tx);font:500 13px/1.4 var(--ui);min-height:100vh;
 background:radial-gradient(600px 380px at 105% -5%,rgba(178,75,255,.22),transparent 70%),radial-gradient(520px 420px at -10% 8%,rgba(34,225,255,.16),transparent 70%),var(--bg);background-attachment:fixed}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}

/* ===== SKINY ===== */

:root[data-skin=terminal],:root[data-skin=amber]{--bg:#000;--panel:rgba(0,12,4,.9);--panel2:#031a0a;--line:rgba(51,255,102,.45);--tx:#9dffb4;--mut:#3fae5d;--g:#33ff66;--o:#ffd23a;--r:#ff4a4a;--acc:#33ff66;--mag:#33ff66;--ui:var(--mono);--rad:0px;--glow:0 0 8px}

:root[data-skin=terminal] h1::before,:root[data-skin=amber] h1::before{content:"~$";color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}

@keyframes caret{50%{opacity:0}}
:root[data-skin=terminal] h2::before,:root[data-skin=amber] h2::before{content:"$";color:var(--mut);text-shadow:none}

:root[data-skin=terminal] .banner span,:root[data-skin=amber] .banner span{display:none}
:root[data-skin=terminal] .banner.ok::after,:root[data-skin=amber] .banner.ok::after{content:"[OK]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.warn::after,:root[data-skin=amber] .banner.warn::after{content:"[WARN]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad,:root[data-skin=amber] .banner.bad{background:var(--r);color:#000;text-shadow:none}
:root[data-skin=terminal] .banner.bad::after,:root[data-skin=amber] .banner.bad::after{content:"[ALERT]";flex:none;position:static;inset:auto;transform:none;animation:none;background:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad.blink,:root[data-skin=amber] .banner.bad.blink,:root[data-skin=terminal] .al.new,:root[data-skin=amber] .al.new{animation:inv .9s steps(1) infinite}
@keyframes inv{0%,100%{background:var(--r);color:#000;border-color:var(--r)}50%{background:#000;color:var(--r);border-color:var(--r)}}
:root[data-skin=terminal] .al.new .x,:root[data-skin=amber] .al.new .x,:root[data-skin=terminal] .al.new .t,:root[data-skin=amber] .al.new .t,:root[data-skin=terminal] .al.new .k2,:root[data-skin=amber] .al.new .k2,:root[data-skin=terminal] .al.new i,:root[data-skin=amber] .al.new i{color:inherit}

/* Dracula – vzhled editoru kódu */

@keyframes flashbg{50%{box-shadow:inset 0 0 0 2px var(--r),inset 0 0 40px rgba(255,70,70,.9);filter:brightness(1.4)}}
:root:is([data-skin=zaklad],[data-skin=pulse],[data-skin=network]) :is(.al.new,.banner.bad.blink,.al .n){animation:flashbg .9s ease-in-out infinite}
:root[data-skin=zaklad],:root[data-skin=pulse],:root[data-skin=network]{--bg:#000;--panel:rgba(2,5,16,.84);--line:rgba(120,160,255,.6);--acc:#7aa2ff;--mag:#f2a516;--g:#7dd3a0;--o:#f2a516;--r:#ff6b5e;--tx:#fff;--mut:#c3cfe8;--ui:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;--mono:var(--ui);--clip:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
:root[data-skin=zaklad] body::after,:root[data-skin=pulse] body::after,:root[data-skin=network] body::after{opacity:.07;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
:root[data-skin=pulse]{--ui:"Chakra Petch",sans-serif;--mono:"Chakra Petch",sans-serif}
:root[data-skin=pulse] h2::before{content:"◢";color:var(--acc);text-shadow:0 0 8px var(--acc)}
:root[data-skin=network]{--ui:"Exo 2",sans-serif;--mono:"Orbitron",sans-serif;--line:rgba(122,162,255,.6);--clip:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
:root[data-skin=network] h2::before{content:"⬢";color:var(--acc);text-shadow:0 0 8px var(--acc)}
:root[data-skin=network] #net{display:block}
:root[data-skin=network] .k b{font-size:20px}:root[data-skin=network] .ag .nm,:root[data-skin=network] .al .t{font-size:12px}
:root[data-skin=synth]{--bg:#06001a;--panel:rgba(8,0,28,.82);--line:rgba(0,240,255,.7);--acc:#00f0ff;--mag:#ff2bd6;--g:#39ffb0;--o:#ffd23a;--r:#ff3b6b;--tx:#fff;--mut:#b9c0ff;--ui:"Rajdhani",sans-serif;--mono:"Audiowide",sans-serif}
:root[data-skin=synth] body{background:radial-gradient(900px 600px at 15% 0%,rgba(255,43,214,.45),transparent 65%),radial-gradient(900px 600px at 100% 100%,rgba(0,240,255,.4),transparent 60%),linear-gradient(180deg,#14003a,#06001a);background-attachment:fixed;font-size:14.5px;font-weight:600}
:root[data-skin=synth] :is(.al,.ag,.k,.banner,.row,.hi){border-radius:14px;border:2px solid var(--acc);box-shadow:inset 0 0 22px rgba(0,240,255,.1),0 0 16px rgba(0,240,255,.35)}
:root[data-skin=synth] .al.s3,:root[data-skin=synth] .ag.red{border-color:var(--r);box-shadow:inset 0 0 22px rgba(255,59,107,.15),0 0 16px rgba(255,59,107,.5)}
:root[data-skin=synth] h2{color:var(--mag);text-shadow:0 0 12px var(--mag)}:root[data-skin=synth] h2::before{content:"▶";color:var(--acc)}
:root[data-skin=synth] .floor{display:block;position:fixed;left:-50%;right:-50%;bottom:0;height:42vh;z-index:0;pointer-events:none;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(255,43,214,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.5) 1px,transparent 1px);background-size:60px 60px;animation:floor 2.4s linear infinite;-webkit-mask-image:linear-gradient(0deg,#000,transparent 85%);mask-image:linear-gradient(0deg,#000,transparent 85%);opacity:.5}
@keyframes floor{to{background-position:0 60px,0 0}}
:root[data-skin=synth] .banner.bad{background:linear-gradient(100deg,#ff2b6b,#b0125a);border-color:#fff}
:root[data-skin=hologram]{--bg:#0a0f2c;--panel:rgba(120,170,255,.09);--line:rgba(170,220,255,.5);--acc:#9ae6ff;--mag:#c79bff;--g:#8dffd0;--o:#ffe08a;--r:#ff7a8a;--tx:#f0f6ff;--mut:#b4c6ee;--ui:"Exo 2",sans-serif;--mono:"Michroma",sans-serif}
:root[data-skin=hologram] body{background:radial-gradient(700px 500px at 10% 0%,rgba(199,155,255,.35),transparent 65%),radial-gradient(700px 500px at 100% 90%,rgba(154,230,255,.3),transparent 60%),linear-gradient(160deg,#0a0f2c,#150a35);background-attachment:fixed;font-weight:300;font-size:14px}
:root[data-skin=hologram] :is(.al,.ag,.k,.banner,.row,.hi){border-radius:20px;border:1px solid rgba(190,230,255,.5);backdrop-filter:blur(16px) saturate(1.5)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 30px rgba(20,10,80,.35)}
:root[data-skin=hologram] :is(.al.new,.banner.bad.blink){animation:neon 1s ease-in-out infinite}
:root[data-skin=hologram] .k b{font-size:20px}:root[data-skin=hologram] h2{letter-spacing:2px}
:root[data-skin=matrix]{--bg:#000;--panel:rgba(0,10,4,.86);--line:rgba(57,255,136,.6);--acc:#39ff88;--mag:#d6ff3a;--g:#39ff88;--o:#d6ff3a;--r:#ff4a4a;--tx:#d8ffe6;--mut:#8fe8b0;--ui:"Share Tech Mono",monospace;--mono:"Share Tech Mono",monospace}
:root[data-skin=matrix] #net{display:block;opacity:.55}
:root[data-skin=matrix] :is(.al,.ag,.k,.banner,.row,.hi){border:1px solid var(--line);box-shadow:0 0 12px rgba(57,255,136,.18),inset 0 0 26px rgba(57,255,136,.05)}
:root[data-skin=matrix] :is(.al.new,.banner.bad.blink){animation:neon 1s ease-in-out infinite}
:root[data-skin=matrix] h1{background:none;color:var(--acc);-webkit-text-fill-color:currentColor;text-shadow:0 0 12px var(--acc)}
.banner.bad,.banner.warn{position:sticky;top:50px;z-index:6}

/* živý přenos zadání */
.feedbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 7px}
.chip{font:700 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.chip.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.feedbox{max-height:340px;overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--acc) transparent}
.feedbox::-webkit-scrollbar{width:6px}.feedbox::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px}.feedbox::-webkit-scrollbar-track{background:transparent}
.fr{position:relative;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:9px;padding:8px 11px;margin-bottom:6px}
.fr.mis{border-left-color:var(--o)}
.fr .h{display:flex;justify-content:space-between;gap:8px;font:700 11px var(--mono);color:var(--mut)}.fr .h b{color:var(--tx)}
.fr .q{margin-top:3px;font-size:14px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.fr .u{margin-top:3px;font-size:11px;color:var(--mut);word-break:break-word}.fr .u::before{content:"agent: ";opacity:.7}
.fr.fresh{animation:fresh 2.6s ease-out 1}
@keyframes fresh{0%{background:rgba(52,255,160,.45)}100%{background:var(--panel)}}
.lv2{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:ping 2s infinite;margin-right:4px}

/* avatary agentů (kulatá fotka místo jména) */
.av{display:inline-block;width:30px;height:30px;border-radius:50%!important;object-fit:cover;vertical-align:middle;border:2px solid var(--acc);box-shadow:0 0 10px rgba(110,168,255,.4);background:#000;clip-path:none!important}
.al .t .av,.fr .h .av,.hi .av,.row .av{width:24px;height:24px}
.ag .nm .av{width:34px;height:34px}
.ag.red .nm .av{border-color:var(--r)}.ag.orange .nm .av{border-color:var(--o)}
:root[data-skin=terminal] .av,:root[data-skin=amber] .av{filter:grayscale(1) contrast(1.2) sepia(.3);border-radius:0!important}

const akeyc=s=>norm(s).replace(/\s+/g,'');
const who=n=>{const a=AVATARS[akeyc(n)];return a?`<img class="av" src="${a}" alt="${esc(n)}" title="${esc(n)}">`:esc(n)};
const SKINS=['zaklad','pulse','network','synth','hologram','matrix','neon','terminal','amber','dracula','day'];
// pamatování skinu: localStorage + cookie (záloha, když prohlížeč úložiště blokuje); načtení probíhá už v <head>, takže nic nebliká
function saveSkin(s){try{localStorage.setItem('dozorSkin',s)}catch(e){}try{document.cookie='dozorSkin='+s+';path=/;max-age=31536000;SameSite=Lax'}catch(e){}}
function setSkin(s){if(!SKINS.includes(s))s='zaklad';document.documentElement.dataset.skin=s;$('skin').value=s;saveSkin(s);fx()}
// animované pozadí: Network (částice) a Matrix (padající znaky); respektuje „omezit pohyb“
const cv=$('net'),cx=cv.getContext('2d');let raf=0,W=0,H=0,P=[],drops=[],rt=0;const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(70,Math.round(W*H/22000));P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35});drops=[];for(let i=0;i<Math.ceil(W/16);i++)drops.push(Math.random()*H/16)}
addEventListener('resize',size);
function frame(){const sk=document.documentElement.dataset.skin;
 if(sk==='network'){cx.clearRect(0,0,W,H);for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<22000){cx.strokeStyle='rgba(122,162,255,'+(.35*(1-d/22000)).toFixed(3)+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}cx.fillStyle='rgba(122,162,255,.85)';cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.283);cx.fill()}}
 else if(sk==='matrix'){if(++rt%2){raf=requestAnimationFrame(frame);return}cx.fillStyle='rgba(0,10,4,.14)';cx.fillRect(0,0,W,H);cx.font='14px monospace';for(let i=0;i<drops.length;i++){cx.fillStyle=Math.random()>.96?'#eaffef':'#39ff88';cx.fillText(String.fromCharCode(0x30A0+Math.random()*90),i*16,drops[i]*16);if(drops[i]*16>H&&Math.random()>.975)drops[i]=0;drops[i]++}}
 else{raf=0;return}
 raf=document.hidden?setTimeout(()=>{raf=requestAnimationFrame(frame)},1000):requestAnimationFrame(frame)}
function fx(){cancelAnimationFrame(raf);raf=0;cx.clearRect(0,0,W,H);const sk=document.documentElement.dataset.skin;if(!calm&&(sk==='network'||sk==='matrix')){size();frame()}}
setSkin(document.documentElement.dataset.skin);
$('skin').onchange=e=>setSkin(e.target.value);
const REFRESH=10;let left=REFRESH,last=null,failed=0,prevIds=null,openAg=new Set(LS.get('dozorOpen',[])),ack=new Set(LS.get('dozorAck',[])),sound=LS.get('dozorSound',false),unacked=0,flip=false;
const KIND={bezi:'běží',ceka:'čeká',stoji:'stojí',nejasne:'stav nejasný',none:'nehlásil se'};
function snd(){$('snd').textContent=sound?'🔔':'🔕';$('snd').classList.toggle('on',sound)}snd();
let actx=null;function beep(){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.14)})}catch(e){}}
$('snd').onclick=()=>{sound=!sound;LS.set('dozorSound',sound);snd();if(sound)beep()};
function alerts(d){const a=[],now=Date.now();
 (d.openAsk||[]).forEach(r=>a.push({id:'ask|'+r.at+'|'+r.agent+'|'+r.zasah,sev:3,kind:'Zásah člověka',agent:r.agent,at:r.at,text:r.zasah,sub:r.typ||''}));
 d.agents.filter(x=>x.level==='red').forEach(x=>{const rs=x.why.filter(w=>!/^čeká na zásah/.test(w));if(rs.length)a.push({id:'ag|'+x.agent+'|'+rs.join('|').replace(/\d+/g,'#'),sev:3,kind:'Agent – pozor',agent:x.agent,at:'',text:rs.join(' · '),sub:''})});
 (d.recent||[]).forEach(r=>{if(/vyres|hotov/.test(norm(r.kst)))return;a.push({id:'pr|'+r.t+'|'+r.agent+'|'+r.typ,sev:r.sev||2,kind:'Problém',agent:r.agent,at:r.at,text:r.typ+(r.codelam?' – '+r.codelam:''),sub:r.zav||''})});
 (d.misunder||[]).filter(r=>now-r.t<3600e3).forEach(r=>a.push({id:'mi|'+r.t+'|'+r.agent,sev:2,kind:'Nedorozumění',agent:r.agent,at:r.at,text:r.zad,sub:r.typ||''}));
 return a.sort((x,y)=>(ack.has(x.id)-ack.has(y.id))||y.sev-x.sev)}
function al(x){const n=!ack.has(x.id);return `<div class="al s${x.sev}${n?' new':' ack'}" data-id="${esc(x.id)}"><div class="t"><span>${n?'<span class="n">NOVÉ</span>':''}${who(x.agent)}</span><i>${esc(x.at)}</i></div><div class="k2">${esc(x.kind)}${x.sub?' · '+esc(x.sub):''}</div><div class="x">${esc(x.text)}</div></div>`}
function agent(a){if(!a.reported)return `<div class="ag none"><summary style="display:block;padding:8px 11px;cursor:default"><span class="nm">${esc(a.agent)}</span> <span class="st" style="float:right">nehlásil se</span></summary></div>`;
 const age=a.poslAgeMin==null?'':(a.poslAgeMin>=60?Math.floor(a.poslAgeMin/60)+' h '+a.poslAgeMin%60+' min':a.poslAgeMin+' min')+' zpět';
 return `<details class="ag ${a.level}" data-ag="${esc(a.agent)}"${openAg.has(a.agent)?' open':''}><summary><span class="nm">${who(a.agent)}</span><span class="st">${esc(a.stav||KIND[a.kind])}${age?' · '+esc(age):''}</span><span class="ci">${esc(a.cinnost)||'—'}</span>${a.why.length?`<span class="why">${esc(a.why.join(' · '))}</span>`:''}</summary>
 <dl><dt>Poslední aktivita</dt><dd>${esc(a.posl)||'—'}</dd><dt>Problémy / hod.</dt><dd><b>${a.problemsHour}</b></dd><dt>Poslední problém</dt><dd>${esc(a.poslProb)||'—'}</dd><dt>Účet / PC</dt><dd>${esc(a.ucet)||'—'} / ${esc(a.pc)||'—'}</dd></dl></details>`}
function list(t,l,open){return `<details class="sec"${open?' open':''}><summary>${t} (${(l||[]).length})</summary>${(l||[]).length?l.map(r=>`<div class="row"><b>${who(r.agent)}</b> <span class="m">${esc(r.at)}${r.typ?' · '+esc(r.typ):''}</span><div class="q">${esc(r.zad)}</div></div>`).join(''):'<div class="empty">Nic.</div>'}</details>`}
function hist(l){const n=(l||[]).length;return `<details class="sec" data-ag="__hist"${openAg.has('__hist')?' open':''}><summary>Historie upozornění – 24 h (${n})</summary>${n?l.map(r=>{const ok=/vyres|hotov/.test(norm(r.kst));return `<div class="hi s${r.sev||2}"><b>${who(r.agent)}</b> <span class="m">${esc(r.at)} · ${esc(r.udalost||'problém')}${ok?' · <span class="ok">✔ vyřešeno</span>':''}</span><div class="x">${esc(r.typ||r.codelam)}${r.zasah&&!/^ne$/.test(norm(r.zasah))?' – zásah: '+esc(r.zasah):''}</div></div>`}).join(''):'<div class="empty">Za posledních 24 h nic.</div>'}</details>`}
let feedF='',prevReq=null;
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'právě teď':m<60?'před '+m+' min':'před '+Math.floor(m/60)+' h '+m%60+' min'}
function feed(d){const all=(d.requests||[]),names=[...new Set(all.map(r=>r.agent))];if(feedF&&!names.includes(feedF))feedF='';
 const l=all.filter(r=>!feedF||r.agent===feedF),seen=prevReq;
 const ids=all.map(r=>r.t+'|'+r.agent+'|'+r.zad);
 const chips=`<div class="feedbar"><span class="chip${feedF?'':' on'}" data-f="">Vše (${all.length})</span>${names.map(n=>`<span class="chip${feedF===n?' on':''}" data-f="${esc(n)}">${esc(n)}</span>`).join('')}</div>`;
 const rows=l.map(r=>{const fresh=seen&&!seen.has(r.t+'|'+r.agent+'|'+r.zad);return `<div class="fr${fresh?' fresh':''}"><div class="h"><b>${who(r.agent)}</b><span>${esc(r.at)} · ${ago(r.t)}</span></div><div class="q">${esc(r.zad)}</div>${r.codelam?`<div class="u">${esc(r.codelam)}</div>`:''}</div>`}).join('');
 prevReq=new Set(ids);
 return `<h2><span class="lv2"></span>Co uživatelé zadávají<span class="sp"></span></h2>${all.length?chips+`<div class="feedbox" id="feedbox">${rows}</div>`:'<div class="empty">Zatím žádná zadání v Logu.</div>'}`}
function render(d){const fbOld=$('feedbox'),fsc=fbOld?fbOld.scrollTop:0;const s=d.summary,A=alerts(d),ids=A.map(x=>x.id);
 const fresh=A.filter(x=>!ack.has(x.id));unacked=fresh.length;
 if(prevIds&&fresh.some(x=>!prevIds.has(x.id)))beep();prevIds=new Set(ids);
 ack=new Set([...ack].filter(i=>prevIds.has(i)));LS.set('dozorAck',[...ack]);
 let h='';
 if(failed>=2)h+=`<div class="banner bad blink" style="margin-bottom:8px">⚠ Spojení ztraceno<small>Zobrazená data jsou stará – obnovuji…</small></div>`;
 else if(!d.readAt)h+=`<div class="banner warn">Zatím žádná data z tabulky</div>`;
 else if(d.workTime&&d.dataAgeMin>5)h+=`<div class="banner bad blink" style="margin-bottom:8px">⚠ Data jsou stará ${d.dataAgeMin} min<small>Tabulku se nepodařilo načíst – stav nemusí odpovídat.</small></div>`;
 if(unacked)h+=`<div class="banner bad blink"><span style="font-size:24px">⚠</span><div>${unacked} ${unacked===1?'nové upozornění':unacked<5?'nová upozornění':'nových upozornění'}<small>Klepnutím na kartu upozornění potvrdíte</small></div></div>`;
 else if(s.red||s.zasah)h+=`<div class="banner bad"><span style="font-size:24px">●</span><div>Potvrzené problémy trvají<small>${s.zasah||0}× zásah člověka · ${s.red} agent(ů) červeně</small></div></div>`;
 else if(s.orange||s.sProblemem)h+=`<div class="banner warn"><span style="font-size:24px">●</span><div>Drobné problémy<small>${s.sProblemem} agent(ů) hlásí problém za poslední hodinu</small></div></div>`;
 else h+=`<div class="banner ok"><span style="font-size:24px">✔</span><div>Vše v pořádku<small>${s.bezi} běží · ${s.ceka} čeká</small></div></div>`;
 if(!d.workTime)h+=`<div class="meta" style="margin:6px 2px 0">Mimo pracovní dobu (po–pá 6–17) – nečinnost se nevyhodnocuje.</div>`;
 h+=`<div class="kpi"><div class="k r"><b>${s.zasah||0}</b><span>zásah</span></div><div class="k g"><b>${s.bezi}</b><span>běží</span></div><div class="k o"><b>${s.sProblemem}</b><span>problém/h</span></div><div class="k"><b>${s.bezHlaseni}</b><span>mlčí</span></div></div>`;
 h+=`<h2>Upozornění<span class="sp"></span>${A.some(x=>!ack.has(x.id))?'<button class="link" id="ackall">Potvrdit vše</button>':''}</h2>`+(A.length?A.map(al).join(''):'<div class="empty">Žádná aktivní upozornění.</div>');
 h+=feed(d);
 h+=`<h2>Agenti</h2>`+(d.agents.map(agent).join('')||'<div class="empty">Tabulka neobsahuje agenty.</div>');
 h+=hist(d.history)+list('Nedorozumění',d.misunder,false);
 $('root').innerHTML=h;{const fb=$('feedbox');if(fb)fb.scrollTop=fsc}$('meta').textContent='Praha '+d.now+(d.readAt?' · data před '+(d.dataAgeMin||0)+' min':'');
 $('lv').classList.toggle('off',failed>=2);}
$('root').addEventListener('click',e=>{const ch=e.target.closest('.chip');if(ch){feedF=ch.dataset.f||'';if(last)render(last);return}const c=e.target.closest('.al');if(c){ack.add(c.dataset.id);LS.set('dozorAck',[...ack]);if(last)render(last);return}if(e.target.id==='ackall'){alerts(last).forEach(x=>ack.add(x.id));LS.set('dozorAck',[...ack]);render(last)}});
$('root').addEventListener('toggle',e=>{const n=e.target.dataset&&e.target.dataset.ag;if(!n)return;e.target.open?openAg.add(n):openAg.delete(n);LS.set('dozorOpen',[...openAg])},true);
async function load(){left=REFRESH;try{const r=await fetch('/api/agents/dozor',{cache:'no-store'});if(r.status===401){location.reload();return}last=await r.json();failed=0;render(last)}catch(e){failed++;if(last)render(last);else $('meta').textContent='Chyba načtení'}}
$('rf').onclick=load;load();
setInterval(()=>{left--;if(left<=0)load();else if(last)$('lv').title='obnova za '+left+' s'},1000);
setInterval(()=>{flip=!flip;document.title=unacked&&flip?'⚠ '+unacked+' nové – Dozor':(unacked?'('+unacked+') Dozor agentů':'Dozor agentů')},900);
})();
</script></body></html>
