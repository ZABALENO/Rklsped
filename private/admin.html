<style>
:root{--bg:#02040b;--panel:rgba(12,20,44,.62);--panel2:rgba(20,32,66,.7);--line:rgba(70,190,255,.22);--tx:#e9f4ff;--mut:#7f96c2;--g:#2dffb0;--o:#ffb02e;--r:#ff3b5c;--acc:#22e1ff;--mag:#b24bff;--ui:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;--rad:8px;--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;--glow:0 0 14px}
:root[data-skin=day]{--bg:#e9f0fb;--panel:rgba(255,255,255,.78);--panel2:rgba(255,255,255,.9);--line:rgba(20,80,180,.22);--tx:#0b1630;--mut:#4f5f86;--g:#08915a;--o:#b36b00;--r:#d3173f;--acc:#0a6fd6;--mag:#7a2bd0;--glow:0 0 0}
*{box-sizing:border-box}html,body{margin:0}html{background:var(--bg)}
body{color:var(--tx);font:500 13px/1.4 var(--ui);min-height:100vh;
 background:radial-gradient(600px 380px at 105% -5%,rgba(178,75,255,.22),transparent 70%),radial-gradient(520px 420px at -10% 8%,rgba(34,225,255,.16),transparent 70%),var(--bg);background-attachment:fixed}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}

/* ===== SKINY ===== */

:root[data-skin=terminal],:root[data-skin=amber]{--bg:#000;--panel:rgba(0,12,4,.9);--panel2:#031a0a;--line:rgba(51,255,102,.45);--tx:#9dffb4;--mut:#3fae5d;--g:#33ff66;--o:#ffd23a;--r:#ff4a4a;--acc:#33ff66;--mag:#33ff66;--ui:var(--mono);--rad:0px;--glow:0 0 8px}

:root[data-skin=terminal] h1::before,:root[data-skin=amber] h1::before{content:"~$";color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}

@keyframes caret{50%{opacity:0}}
:root[data-skin=terminal] h2::before,:root[data-skin=amber] h2::before{content:"$";color:var(--mut);text-shadow:none}

:root[data-skin=terminal] .banner span,:root[data-skin=amber] .banner span{display:none}
:root[data-skin=terminal] .banner.ok::after,:root[data-skin=amber] .banner.ok::after{content:"[OK]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.warn::after,:root[data-skin=amber] .banner.warn::after{content:"[WARN]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad,:root[data-skin=amber] .banner.bad{background:var(--r);color:#000;text-shadow:none}
:root[data-skin=terminal] .banner.bad::after,:root[data-skin=amber] .banner.bad::after{content:"[ALERT]";flex:none;position:static;inset:auto;transform:none;animation:none;background:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad.blink,:root[data-skin=amber] .banner.bad.blink,:root[data-skin=terminal] .al.new,:root[data-skin=amber] .al.new{animation:inv .9s steps(1) infinite}
@keyframes inv{0%,100%{background:var(--r);color:#000;border-color:var(--r)}50%{background:#000;color:var(--r);border-color:var(--r)}}
:root[data-skin=terminal] .al.new .x,:root[data-skin=amber] .al.new .x,:root[data-skin=terminal] .al.new .t,:root[data-skin=amber] .al.new .t,:root[data-skin=terminal] .al.new .k2,:root[data-skin=amber] .al.new .k2,:root[data-skin=terminal] .al.new i,:root[data-skin=amber] .al.new i{color:inherit}

/* Dracula – vzhled editoru kódu */

 const age=a.poslAgeMin==null?'':(a.poslAgeMin>=60?Math.floor(a.poslAgeMin/60)+' h '+a.poslAgeMin%60+' min':a.poslAgeMin+' min')+' zpět';
 return `<details class="ag ${a.level}" data-ag="${esc(a.agent)}"${openAg.has(a.agent)?' open':''}><summary><span class="nm">${who(a.agent)}</span><span class="st">${esc(a.stav||KIND[a.kind])}${age?' · '+esc(age):''}</span><span class="ci">${esc(a.cinnost)||'—'}</span>${a.why.length?`<span class="why">${esc(a.why.join(' · '))}</span>`:''}</summary>
 <dl><dt>Poslední aktivita</dt><dd>${esc(a.posl)||'—'}</dd><dt>Problémy / hod.</dt><dd><b>${a.problemsHour}</b></dd><dt>Poslední problém</dt><dd>${esc(a.poslProb)||'—'}</dd><dt>Účet / PC</dt><dd>${esc(a.ucet)||'—'} / ${esc(a.pc)||'—'}</dd></dl></details>`}
function list(t,l,open){return `<details class="sec"${open?' open':''}><summary>${t} (${(l||[]).length})</summary>${(l||[]).length?l.map(r=>`<div class="row"><b>${who(r.agent)}</b> <span class="m">${esc(r.at)}${r.typ?' · '+esc(r.typ):''}</span><div class="q">${esc(r.zad)}</div></div>`).join(''):'<div class="empty">Nic.</div>'}</details>`}
function hist(l){const n=(l||[]).length;return `<details class="sec" data-ag="__hist"${openAg.has('__hist')?' open':''}><summary>Historie upozornění – 24 h (${n})</summary>${n?l.map(r=>{const ok=/vyres|hotov/.test(norm(r.kst));return `<div class="hi s${r.sev||2}"><b>${who(r.agent)}</b> <span class="m">${esc(r.at)} · ${esc(r.udalost||'problém')}${ok?' · <span class="ok">✔ vyřešeno</span>':''}</span><div class="x">${esc(r.typ||r.codelam)}${r.zasah&&!/^ne$/.test(norm(r.zasah))?' – zásah: '+esc(r.zasah):''}</div></div>`}).join(''):'<div class="empty">Za posledních 24 h nic.</div>'}</details>`}
let poz=null;
const nfz=new Intl.NumberFormat('cs-CZ');
let selDay=null;   // null = vždy aktuální (dnešní) den; po přepnutí šipkami konkrétní datum
const DOW=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const todayP=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Prague'});
function autoDay(){const t=todayP(),S=poz&&poz.S;if(!S)return t;const o={};(S.days||[]).forEach(x=>{let n=0;Object.values(x.rels||{}).forEach(q=>n+=(q.pA||0));o[x.date]=n});if(o[t]>0)return t;const ds=Object.keys(o).filter(d=>d<t&&o[d]>0).sort();return ds.length?ds[ds.length-1]:t}
const curDay=()=>selDay||autoDay();
function dayList(){const t=todayP(),ds=new Set(((poz&&poz.S&&poz.S.days)||[]).map(x=>x.date));ds.add(t);return [...ds].sort()}
function top2(){const el=$('top2');if(!poz){el.innerHTML='';return}
 const t=todayP(),au=autoDay(),cur=curDay(),ds=dayList(),ix=ds.indexOf(cur),d=new Date(cur+'T12:00:00Z'),isT=cur===t;
 el.innerHTML=`<div class="t2"><b>${nfz.format(poz.total)}</b><span>pozic celkem</span></div>
 <div class="t2 nav"><button class="nb" data-nav="-1" ${ix<=0?'disabled':''} title="Předchozí den">‹</button><div class="nd" ${cur===au?'':'data-nav="0" title="Zpět na výchozí den"'}><b>${isT?'Dnes':esc(DOW[d.getUTCDay()])}</b><span>${d.getUTCDate()}. ${d.getUTCMonth()+1}. ${d.getUTCFullYear()}</span></div><button class="nb" data-nav="1" ${ix>=ds.length-1?'disabled':''} title="Další den">›</button></div>`;dayView()}
function dayRows(date){const S=poz&&poz.S;if(!S)return null;const rels={};(S.days||[]).filter(x=>x.date===date).forEach(x=>Object.entries(x.rels||{}).forEach(([k,q])=>{const z=rels[k]||(rels[k]={A:0,M:0,T:0});z.A+=(q.pA||0);z.M+=(q.pM||0);z.T+=(q.tA||0)}));
 const nm={};(S.rels||[]).forEach(x=>nm[x.key]=x.name);
 return Object.entries(rels).filter(([,z])=>z.A+z.T>0).map(([k,z])=>({name:nm[k]||k,A:z.A,M:z.M,T:z.T})).sort((x,y)=>(y.A+y.M)-(x.A+x.M)||y.A-x.A)}
function dayView(){const el=$('dayw'),rows=dayRows(curDay());if(!rows){el.innerHTML='';return}
 const cur=curDay(),isT=cur===todayP(),tot=rows.reduce((a,r)=>a+r.A+r.T,0),max=Math.max(1,...rows.map(r=>r.A+r.M)),d=new Date(cur+'T12:00:00Z'),dn=DOW[d.getUTCDay()],dl=(isT?'Dnes · '+dn:dn[0].toUpperCase()+dn.slice(1))+' · '+d.getUTCDate()+'. '+(d.getUTCMonth()+1)+'. '+d.getUTCFullYear();
 const cls=p=>p>=50?'g':p>=25?'o':'r',col={g:'var(--g)',o:'var(--o)',r:'var(--r)'};
 el.innerHTML=`<div class="dw"><div class="dh"><span class="dt">${esc(dl)}</span><span class="big">${nfz.format(tot)}<small class="g">obj. + přep. agent</small></span></div>`+
 (rows.length?`<div class="hd"><span>Součet ▾</span><span></span><span>Agent</span><span>Ručně</span><span>% agent</span></div>`+rows.map(r=>{const t=r.A+r.M,p=t?Math.round(100*r.A/t):0,c=cls(p);return `<div class="dr"><span>${who(r.name)}</span><span class="bw" style="width:${Math.max(6,Math.round(100*t/max))}%"><i style="width:${t?100*r.A/t:0}%;background:${col[c]}"></i></span><span class="n ${c}">${r.A}</span><span class="n m">${r.M}</span><span class="n ${c}">${p} %</span></div>`}).join(''):`<div class="emp">${isT?'Dnes zatím':'Tento den'} agent nezapsal žádnou pozici.</div>`)+`</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b||b.disabled||!poz)return;const au=autoDay(),ds=dayList(),cur=curDay(),ix=ds.indexOf(cur),v=+b.dataset.nav;let n=v===0?au:ds[Math.max(0,Math.min(ds.length-1,ix+v))];selDay=n===au?null:n;top2()});
async function loadPoz(){try{const r=await fetch('/api/agents',{cache:'no-store'});if(!r.ok)return;const j=await r.json();poz={total:j.total||0,S:j.split||null};top2();const f=document.querySelector('#top2 .t2');if(f){f.classList.remove('fl');void f.offsetWidth;f.classList.add('fl')}}catch(e){}}
let feedF='',prevReq=null,roll=LS.get('dozorRoll',true),speed=LS.get('dozorSpd',30),period=LS.get('dozorPer',240),pauseUntil=0,newCount=0;
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'právě teď':m<60?'před '+m+' min':'před '+Math.floor(m/60)+' h '+m%60+' min'}
const rk=r=>r.t+'|'+r.agent+'|'+r.zad;
function snapFeed(){const fb=$('feedbox');if(!fb)return null;const f=[...fb.children].find(c=>c.dataset&&c.dataset.k);return{sc:fb.scrollTop,key:f?f.dataset.k:null,off:f?f.offsetTop:0}}
function restoreFeed(s){const fb=$('feedbox');if(!fb||!s)return;if(s.sc<30){fb.scrollTop=0;return}const f=s.key&&[...fb.children].find(c=>c.dataset&&c.dataset.k===s.key);fb.scrollTop=f?s.sc+(f.offsetTop-s.off):s.sc}
function feed(d,snap){const lim=Date.now()-period*60000,all=(d.requests||[]).filter(r=>r.t>=lim),names=[...new Set(all.map(r=>r.agent))];if(feedF&&!names.includes(feedF))feedF='';
 const l=all.filter(r=>!feedF||r.agent===feedF),seen=prevReq;
 let fresh=0;const rows=l.map(r=>{const k=rk(r),f=seen&&!seen.has(k);if(f)fresh++;return `<div class="fr${f?' fresh':''}" data-k="${esc(k)}" style="--wc:${wcol(r.agent)}"><div class="h"><b>${who(r.agent)}</b><span>${esc(r.at)} · ${ago(r.t)}</span></div><div class="q">${esc(r.zad)}</div>${r.codelam?`<div class="u">${esc(r.codelam)}</div>`:''}</div>`}).join('');
 prevReq=new Set(all.map(rk));
 if(fresh&&snap&&snap.sc>30)newCount+=fresh;else if(!snap||snap.sc<=30)newCount=0;
 const chips=`<div class="feedbar"><span class="chip${feedF?'':' on'}" data-f="">Vše (${all.length})</span>${names.map(n=>`<span class="chip${feedF===n?' on':''}" data-f="${esc(n)}" style="--wc:${wcol(n)}">${esc(n)}</span>`).join('')}</div>`;
 const ctl=`<div class="feedbar ctl"><span class="chip${roll?' on':''}" data-act="roll">${roll?'⏸ rolování':'▶ rolování'}</span>${[[14,'pomalu'],[30,'středně'],[60,'rychle']].map(([v,t])=>`<span class="chip${speed===v?' on':''}" data-spd="${v}">${t}</span>`).join('')}<span class="chip-sp"></span>${[[60,'1 h'],[240,'4 h'],[1440,'24 h']].map(([v,t])=>`<span class="chip${period===v?' on':''}" data-per="${v}">${t}</span>`).join('')}</div>`;
 return `<h2><span class="lv2"></span>Co uživatelé zadávají<span class="sp"></span><button class="link newb" id="newb" data-act="top"${newCount?'':' hidden'}>↑ ${newCount} nové</button></h2>${ctl}${all.length?chips+`<div class="feedbox" id="feedbox">${rows}</div>`:'<div class="empty">V tomto období žádná zadání.</div>'}`}
// automatické rolování: plynule posouvá okno od nejnovějších k starším, na konci se po chvíli vrátí nahoru; pozastaví se při najetí myší / dotyku
let endAt=0,lastTs=0,acc=0;
function tick(ts){const fb=$('feedbox');
 if(fb&&roll&&Date.now()>pauseUntil&&!fb.matches(':hover')&&fb.scrollHeight>fb.clientHeight+4){
  const dt=Math.min(.1,(ts-(lastTs||ts))/1000);acc+=speed*dt;const px=Math.floor(acc);if(px>=1){acc-=px;fb.scrollTop+=px}
  if(fb.scrollTop+fb.clientHeight>=fb.scrollHeight-1){if(!endAt)endAt=ts;if(ts-endAt>2200){fb.scrollTop=0;endAt=0}}else endAt=0}
 if(fb&&fb.scrollTop<30&&newCount){newCount=0;const nb=$('newb');if(nb)nb.hidden=true}
 lastTs=ts;requestAnimationFrame(tick)}
requestAnimationFrame(tick);
['wheel','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('#feedbox'))pauseUntil=Date.now()+8000},{passive:true,capture:true}));
const lwClosed=new Set(LS.get('dozorLwClosed',[]));
function lwEntry(e){const f=(e.flags||[]).map(x=>`<span class="fl2 ${x.lv==='red'?'red':''}">${esc(x.t)}</span>`).join('');
 return `<div class="le ${e.level}"><div class="m">${esc(e.when)}${e.status?' · stav: '+esc(e.status):''} · řádek ${e.row}</div><div class="qt">${esc(e.request||'(bez doslovného zadání)')}</div>${f?'<div>'+f+'</div>':''}${e.result?`<div class="r"><b>VÝSLEDEK</b> ${esc(e.result)}</div>`:''}${e.check?`<div class="r"><b>KONTROLA</b> ${esc(e.check)}</div>`:''}${e.problem?`<div class="r"><b>PROBLÉM</b> ${esc(e.problem)}</div>`:''}${e.solution?`<div class="r"><b>ŘEŠENÍ</b> ${esc(e.solution)}</div>`:''}</div>`}
function lwView(L){if(!L)return '';const S=L.summary||{};let h=`<h2>Logy agentů – listy „Log…“ (${S.sheets||0})</h2>`;
 if(L.error)h+=`<div class="banner warn" style="margin-bottom:6px">${esc(L.error)}</div>`;
 if(!L.at)return h+'<div class="empty">Čekám na první načtení tabulky…</div>';
 h+=`<div class="meta" style="margin:0 2px 6px">načteno ${esc(new Date(L.at).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague'}))} · záznamů ${S.entries} · s chybou/nedorozuměním ${S.red+S.orange} · nedokončených ${S.open}</div>`;
 h+=(L.sheets||[]).map(sh=>{const c=sh.cnt,lv=c.red?'🔴':c.orange?'🟠':'🟢',k=sh.sheet;return `<details class="lw" data-lw="${esc(k)}"${lwClosed.has(k)?'':' open'}><summary>${lv} ${esc(sh.agent)}<span class="ct">list „${esc(sh.sheet)}“ · ${c.total} zadání · ${c.red+c.orange} k pozornosti${c.open?' · '+c.open+' nedokončeno':''}</span></summary>${sh.entries.length?sh.entries.map(lwEntry).join(''):'<div class="empty">Zatím žádné záznamy.</div>'}</details>`}).join('')||'<div class="empty">Žádný list začínající „Log“.</div>';
 return h}
function lwFlat(L){if(!L)return '<div class="empty">Čekám na data…</div>';let h='';
 if(L.error)h+=`<div class="meta" style="margin:0 2px 8px">${esc(L.error)}</div>`;
 if(!L.at)return h+'<div class="empty">Čekám na první načtení tabulky…</div>';
 const f=L.feed||[];
 h+=f.length?f.map(e=>{const v=e.done==='ok'?'✔ provedeno OK':e.done==='no'?'✖ neprovedeno / problém':'… výsledek zatím nezapsán';
  return `<div class="le"><div class="m"><b>${esc(e.agent)}</b> · ${esc(e.when)}</div><div class="qt">${esc(e.request||'(bez doslovného zadání)')}</div><div class="r"><b>${v}</b>${e.result?' – '+esc(e.result):''}${e.problem?`<br>Problém: ${esc(e.problem)}${e.solution?' · Řešení: '+esc(e.solution):''}`:''}</div></div>`}).join(''):'<div class="empty">Žádná zadání v listech „Log…“.</div>';
 return h}
function renderOld(d){const fsnap=snapFeed();const s=d.summary,A=alerts(d),ids=A.map(x=>x.id);
 const fresh=A.filter(x=>!ack.has(x.id));unacked=fresh.length;
 if(prevIds&&fresh.some(x=>!prevIds.has(x.id)))beep();prevIds=new Set(ids);
 ack=new Set([...ack].filter(i=>prevIds.has(i)));LS.set('dozorAck',[...ack]);
 let h='';
 if(failed>=2)h+=`<div class="banner bad blink" style="margin-bottom:8px">⚠ Spojení ztraceno<small>Zobrazená data jsou stará – obnovuji…</small></div>`;
 else if(!d.readAt)h+=`<div class="banner warn">Zatím žádná data z tabulky</div>`;
 else if(d.workTime&&d.dataAgeMin>5)h+=`<div class="banner bad blink" style="margin-bottom:8px">⚠ Data jsou stará ${d.dataAgeMin} min<small>Tabulku se nepodařilo načíst – stav nemusí odpovídat.</small></div>`;
 if(unacked)h+=`<div class="banner bad blink"><span style="font-size:24px">⚠</span><div>${unacked} ${unacked===1?'nové upozornění':unacked<5?'nová upozornění':'nových upozornění'}<small>Klepnutím na kartu upozornění potvrdíte</small></div></div>`;
 else if(s.red||s.zasah){}   // potvrzená upozornění zůstávají jen v seznamu, bez trvalého pruhu
 else if((s.orange||s.sProblemem)&&LS.get('dozorWarn','')===wsig(d,s)){}
 else if(s.orange||s.sProblemem)h+=`<div class="banner warn" id="warnb" style="cursor:pointer"><span style="font-size:24px">●</span><div>Drobné problémy<small>${s.sProblemem} agent(ů) hlásí problém za poslední hodinu · klepnutím potvrdíte</small></div></div>`;
 else h+=`<div class="banner ok"><span style="font-size:24px">✔</span><div>Vše v pořádku<small>${s.bezi} běží (≤10 min) · ${s.necinny||0} bez aktivity >10 min · ${s.ceka} čeká</small></div></div>`;
 if(!d.workTime)h+=`<div class="meta" style="margin:6px 2px 0">Mimo pracovní dobu (po–pá 6–17) – nečinnost se nevyhodnocuje.</div>`;
 h+=`<div class="kpi"><div class="k r"><b>${s.zasah||0}</b><span>zásah</span></div><div class="k g"><b>${s.bezi}</b><span>běží</span></div><div class="k o"><b>${s.sProblemem}</b><span>problém/h</span></div></div>`;
 const aOff=LS.get('dozorAlOff',false);
 h+=`<h2 id="altog" style="cursor:pointer" title="Zbalit / rozbalit"><span>${aOff?'▸':'▾'}</span>Upozornění${A.length?` (${A.length})`:''}<span class="sp"></span>${!aOff&&A.some(x=>!ack.has(x.id))?'<button class="link" id="ackall">Potvrdit vše</button>':''}</h2>`+(aOff?'':(A.length?A.map(al).join(''):'<div class="empty">Žádná aktivní upozornění.</div>'));
 h+=lwView(d.logwatch);h+=feed(d,fsnap);
 h+=`<h2>Agenti</h2>`+(d.agents.filter(x=>x.level!=='none').map(agent).join('')||'<div class="empty">Zatím se nikdo nehlásil.</div>');
 h+=hist(d.history)+list('Nedorozumění',d.misunder,false);
 $('root').innerHTML=h;restoreFeed(fsnap);$('meta').textContent='Praha '+d.now+(d.readAt?' · data před '+(d.dataAgeMin||0)+' min':'');
 $('lv').classList.toggle('off',failed>=2);}
function render(d){const L=d.logwatch;$('root').innerHTML=lwFlat(L);$('meta').textContent=L&&L.at?'Praha · načteno '+new Date(L.at).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague'})+' · obnova každých 10 s':'načítám…';$('lv').classList.toggle('off',failed>=2)}
$('root').addEventListener('click',e=>{const wb=e.target.closest('#warnb');if(wb&&last){LS.set('dozorWarn',wsig(last,last.summary||{}));render(last);return}const nb=e.target.closest('#newb');if(nb){const fb=$('feedbox');if(fb)fb.scrollTop=0;newCount=0;pauseUntil=Date.now()+8000;if(last)render(last);return}
 if(e.target.closest('#altog')&&!e.target.closest('#ackall')){LS.set('dozorAlOff',!LS.get('dozorAlOff',false));if(last)render(last);return}
 const ch=e.target.closest('.chip');if(ch){if(ch.dataset.act==='roll'){roll=!roll;LS.set('dozorRoll',roll)}else if(ch.dataset.spd){speed=+ch.dataset.spd;LS.set('dozorSpd',speed)}else if(ch.dataset.per){period=+ch.dataset.per;LS.set('dozorPer',period)}else feedF=ch.dataset.f||'';if(last)render(last);return}const c=e.target.closest('.al');if(c){ack.add(c.dataset.id);LS.set('dozorAck',[...ack]);if(last)render(last);return}if(e.target.id==='ackall'){alerts(last).forEach(x=>ack.add(x.id));LS.set('dozorAck',[...ack]);render(last)}});
$('root').addEventListener('toggle',e=>{const n=e.target.dataset&&e.target.dataset.lw;if(!n)return;e.target.open?lwClosed.delete(n):lwClosed.add(n);LS.set('dozorLwClosed',[...lwClosed])},true);
$('root').addEventListener('toggle',e=>{const n=e.target.dataset&&e.target.dataset.ag;if(!n)return;e.target.open?openAg.add(n):openAg.delete(n);LS.set('dozorOpen',[...openAg])},true);
async function load(){left=REFRESH;loadPoz();try{const r=await fetch('/api/agents/dozor',{cache:'no-store'});if(r.status===401){location.reload();return}last=await r.json();failed=0;render(last)}catch(e){failed++;if(last)render(last);else $('meta').textContent='Chyba načtení'}}
$('rf').onclick=load;load();
setInterval(()=>{left--;if(left<=0)load();else if(last)$('lv').title='obnova za '+left+' s';},1000);
setInterval(()=>{flip=!flip;document.title=unacked&&flip?'⚠ '+unacked+' nové – Dozor':(unacked?'('+unacked+') Dozor agentů':'Dozor agentů')},900);
})();
</script></body></html>
