<style>
:root{--bg:#02040b;--panel:rgba(12,20,44,.62);--panel2:rgba(20,32,66,.7);--line:rgba(70,190,255,.22);--tx:#e9f4ff;--mut:#7f96c2;--g:#2dffb0;--o:#ffb02e;--r:#ff3b5c;--acc:#22e1ff;--mag:#b24bff;--ui:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;--rad:8px;--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;--glow:0 0 14px}
:root[data-skin=day]{--bg:#e9f0fb;--panel:rgba(255,255,255,.78);--panel2:rgba(255,255,255,.9);--line:rgba(20,80,180,.22);--tx:#0b1630;--mut:#4f5f86;--g:#08915a;--o:#b36b00;--r:#d3173f;--acc:#0a6fd6;--mag:#7a2bd0;--glow:0 0 0}
*{box-sizing:border-box}html,body{margin:0}html{background:var(--bg)}
body{color:var(--tx);font:500 13px/1.4 var(--ui);min-height:100vh;
 background:radial-gradient(600px 380px at 105% -5%,rgba(178,75,255,.22),transparent 70%),radial-gradient(520px 420px at -10% 8%,rgba(34,225,255,.16),transparent 70%),var(--bg);background-attachment:fixed}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}

/* ===== SKINY ===== */

:root[data-skin=terminal],:root[data-skin=amber]{--bg:#000;--panel:rgba(0,12,4,.9);--panel2:#031a0a;--line:rgba(51,255,102,.45);--tx:#9dffb4;--mut:#3fae5d;--g:#33ff66;--o:#ffd23a;--r:#ff4a4a;--acc:#33ff66;--mag:#33ff66;--ui:var(--mono);--rad:0px;--glow:0 0 8px}

:root[data-skin=terminal] h1::before,:root[data-skin=amber] h1::before{content:"~$";color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}

@keyframes caret{50%{opacity:0}}
:root[data-skin=terminal] h2::before,:root[data-skin=amber] h2::before{content:"$";color:var(--mut);text-shadow:none}

:root[data-skin=terminal] .banner span,:root[data-skin=amber] .banner span{display:none}
:root[data-skin=terminal] .banner.ok::after,:root[data-skin=amber] .banner.ok::after{content:"[OK]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.warn::after,:root[data-skin=amber] .banner.warn::after{content:"[WARN]";flex:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad,:root[data-skin=amber] .banner.bad{background:var(--r);color:#000;text-shadow:none}
:root[data-skin=terminal] .banner.bad::after,:root[data-skin=amber] .banner.bad::after{content:"[ALERT]";flex:none;position:static;inset:auto;transform:none;animation:none;background:none;margin-left:auto;font-weight:800}
:root[data-skin=terminal] .banner.bad.blink,:root[data-skin=amber] .banner.bad.blink,:root[data-skin=terminal] .al.new,:root[data-skin=amber] .al.new{animation:inv .9s steps(1) infinite}
@keyframes inv{0%,100%{background:var(--r);color:#000;border-color:var(--r)}50%{background:#000;color:var(--r);border-color:var(--r)}}
:root[data-skin=terminal] .al.new .x,:root[data-skin=amber] .al.new .x,:root[data-skin=terminal] .al.new .t,:root[data-skin=amber] .al.new .t,:root[data-skin=terminal] .al.new .k2,:root[data-skin=amber] .al.new .k2,:root[data-skin=terminal] .al.new i,:root[data-skin=amber] .al.new i{color:inherit}

/* Dracula – vzhled editoru kódu */

  const bar=e.nSteps?`<div class="r"><b>KROKY</b> ${e.nTicks}/${e.nSteps} <span style="display:inline-block;vertical-align:middle;width:90px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-left:6px"><i style="display:block;height:100%;width:${Math.min(100,Math.round(100*e.nTicks/e.nSteps))}%;border-radius:3px;background:currentColor"></i></span></div>`:'';
  let tm='';if(e.ts&&e.lastTs>e.ts&&g==='ok')tm=`trvalo ${mins((e.lastTs-e.ts)/60000)}`;else if(g==='run'&&e.lastTs&&L.nowN)tm=`poslední krok před ${mins((L.nowN-e.lastTs)/60000)}${(L.nowN-e.lastTs)/60000>60?' ⚠':''}`;
  const tags=(e.ids||[]).map(x=>`<span class="fl2">${esc(x)}</span>`).join('');
  const w=(e.warns||[]).map(x=>`<span class="fl2 red">⚠ ${esc(x)}</span>`).join('');
  return `<details class="le lwcard ac${lwSeen&&!lwSeen.has(k)?' lwnew':''}" data-lwo="${esc(ko)}" style="--wc:${wcol(RN(e.agent))}"${lwOpen.has(ko)?' open':''}><summary><div class="m"><b>${esc(e.agent)}</b> · ${esc(e.when)}${tm?' · '+tm:''}</div><div class="q1">${esc(e.request||'(bez doslovného zadání)')}</div><div class="a2">${esc(reply(e))}</div><div class="vd">${VERD[e.done]||VERD.wait}</div></summary>
   ${tags?'<div>'+tags+'</div>':''}${bar}${ln('CO UŽIVATEL CHCE',e.wants)}${ln('CO ZAČÍNÁ DĚLAT',e.doing)}${ln('KROKY (PLÁN)',e.steps)}${ln('OČEKÁVANÝ VÝSLEDEK',e.expected)}${ln('PRŮBĚH',e.progress)}${ln('VÝSLEDEK',e.result)}${ln('ZÁVĚREČNÁ KONTROLA',e.check)}${ln('PROBLÉM',e.problem)}${ln('ŘEŠENÍ',e.solution)}<div class="m" style="margin-top:4px">list „${esc(e.sheet)}“ · řádek ${e.row}${e.status?' · stav v tabulce: '+esc(e.status):''}</div>${w?'<div>'+w+'</div>':''}</details>`};
 const cnt={},recent=[],older=[];f.forEach(e=>{cnt[e.agent]=(cnt[e.agent]||0)+1;(cnt[e.agent]<=3?recent:older).push(e)});
 const names=[...new Set(recent.map(e=>e.agent))];
 h+=recent.length?'<h2 style="margin-top:12px">Poslední zprávy (3 od každého agenta) – od nejnovějších</h2>'+recent.map(card).join(''):'<div class="empty">Žádná zadání pro tento filtr.</div>';
 const hk='lwHist';h+=`<details class="sec" data-lwo="${hk}"${lwOpen.has(hk)?' open':''} style="margin-top:14px"><summary>Historie – starší zprávy (${older.length})</summary>${older.length?older.map(card).join(''):'<div class="empty">Zatím nic staršího.</div>'}</details>`;
 ctl+=(L.agents||[]).length?`<details class="sec" open><summary>Agenti (${L.agents.length}) – klepnutím na agenta zobrazíš celou jeho historii</summary>`+(L.agents||[]).map(g=>{const sr=g.total?Math.round(100*g.ok/g.total):0,ak='ag:'+g.sheet,hist=all.filter(e=>e.sheet===g.sheet);return `<details class="row" data-lwo="${esc(ak)}"${lwOpen.has(ak)?' open':''}><summary style="cursor:pointer"><b>${esc(g.agent)}</b> <span class="m">nedorozumění ${g.statTotal?g.corrPct+' % ('+g.corr+' z '+g.statTotal+' zadání)':'– (měří se od 11. 11.)'}</span></summary><div style="margin-top:6px">${hist.length?hist.map(e=>card(e,'ag:')).join(''):'<div class="empty">Žádné záznamy.</div>'}</div></details>`}).join('')+'</details>':'';
 h+='<div style="margin-top:16px"></div>'+ctl;
 lwSeen=new Set([...(lwSeen||[]),...all.map(e=>e.agent+'#'+e.row)]);
 return h}

const MA=new Set(LS.get('dozorMisAck',[]));let misCur=null,misSig='';
const gp2=e=>e.done==='ok'?'c-ok':(e.done==='no'||e.done==='user')?'c-bad':'c-run',VD2={ok:'✔ Úspěšně dokončeno – bez zásahu uživatele',no:'✖ Skončilo chybou – nutný zásah nebo rozhodnutí uživatele',user:'✖ Čeká na zásah nebo rozhodnutí uživatele',run:'⏳ Stále pracuje',wait:'⏳ Stále pracuje – výsledek zatím nezapsán'};
function ctxCard(e,lbl,cur){const ln=(t,v)=>v&&String(v).trim()?`<div class="r"><b>${t}</b> ${esc(v)}</div>`:'';return `<div class="cc ${cur?'cur':gp2(e)}"><div class="lbl">${lbl} · ${esc(RN(e.agent))} · ${esc(e.when)} · řádek ${e.row}</div><div class="q1" style="white-space:normal">${esc(e.request||'(bez doslovného zadání)')}</div><div class="r"><b>${VD2[e.done]||VD2.wait}</b></div>${ln('CO UŽIVATEL CHCE',e.wants)}${ln('KROKY (PLÁN)',e.steps)}${ln('PRŮBĚH',e.progress)}${ln('VÝSLEDEK',e.result)}${ln('ZÁVĚREČNÁ KONTROLA',e.check)}${ln('PROBLÉM',e.problem)}${ln('ŘEŠENÍ',e.solution)}</div>`}
function misModal(L){const el=$('mismod');if(!misCur||!L){el.classList.remove('on');return}
 const m=(L.misu||[]).find(x=>x.id===misCur);if(!m){el.classList.remove('on');return}
 const es=(L.feed||[]).filter(e=>e.agent===m.agent).sort((a,b)=>(a.ts-b.ts)||(a.row-b.row)),i=es.findIndex(e=>e.row===m.row&&e.sheet===m.sheet);
 const prev=es.slice(Math.max(0,i-2),i),next=es.slice(i+1);
 el.innerHTML=`<div class="top"><h3>⚠ ${esc(m.kind.toUpperCase())} – ${esc(RN(m.agent))}</h3><button class="cx" data-mis="ack">✓ Potvrdit</button><button class="cx" data-mis="close">✕ Zavřít</button></div><div class="meta" style="margin-bottom:6px">${esc(m.why)}${m.withRow?' (podobné jako řádek '+m.withRow+')':''}</div>`
  +(prev.length?prev.map((e,k)=>ctxCard(e,'PŘEDCHOZÍ '+(prev.length-k))).join(''):'<div class="empty">Žádné předchozí zadání.</div>')
  +ctxCard(es[i],'OZNAČENÉ ZADÁNÍ',true)
  +(next.length?next.map((e,k)=>ctxCard(e,'NÁSLEDUJÍCÍ '+(k+1)+' z '+next.length)).join(''):'<div class="empty">Od označeného zadání nic nepřibylo.</div>');
 el.classList.add('on')}
function misBox(L){const A=((L&&L.misu)||[]).filter(m=>!MA.has(m.id));const sig=A.map(m=>m.id).join('|');if(sig&&sig!==misSig&&A.some(m=>!misSig.includes(m.id)))beep();misSig=sig;
 let p=$('mispop');if(!p){p=document.createElement('div');p.id='mispop';document.body.appendChild(p);const md=document.createElement('div');md.id='mismod';document.body.appendChild(md);
  document.addEventListener('click',e=>{const a=e.target.closest('[data-mis]');if(!a)return;const v=a.dataset.mis;if(v==='close'){misCur=null}else if(v==='ack'){if(misCur){MA.add(misCur);LS.set('dozorMisAck',[...MA].slice(-300))}misCur=null}else if(v==='ackx'){MA.add(a.dataset.id);LS.set('dozorMisAck',[...MA].slice(-300));e.stopPropagation()}else{misCur=a.dataset.id}if(last){misBox(last.logwatch)}})}
 p.innerHTML=A.slice(0,3).map(m=>`<div class="mp" data-mis="open" data-id="${esc(m.id)}"><span class="x" data-mis="ackx" data-id="${esc(m.id)}">✓</span><div class="t">⚠ MOŽNÉ NEDOROZUMĚNÍ · ${esc(m.kind)} · ${esc(RN(m.agent))}</div><div class="qq">„${esc(m.request)}“</div><div class="go">${esc(m.why)} · klepnutím zobrazíš souvislosti</div></div>`).join('')+(A.length>3?`<div class="mp" style="animation:none;background:#8a0f1c;text-align:center" data-mis="open" data-id="${esc(A[3].id)}">+ ${A.length-3} dalších</div>`:'');
 misModal(L)}
let idleSig='';
function idleBox(L){const I=(L&&L.idle)||[];const sig=I.map(x=>x.agent).join('|');if(sig&&sig!==idleSig&&idleSig!==null)beep();idleSig=sig;if(!I.length)return '';return `<div class="banner bad blink" style="margin-bottom:10px;display:block"><div style="font-size:15px;font-weight:800">⚠ Agent nepracuje déle než 20 min (po–pá 7–15 h)</div>${I.map(x=>`<div style="margin-top:4px;font-size:13px"><b>${esc(RN(x.agent))}</b> – bez práce ${mins(x.idleMin)} · ${esc(x.why)} · poslední zadání: „${esc(String(x.lastRequest||'').slice(0,80))}“</div>`).join('')}</div>`}
function render(d){const L=d.logwatch;$('root').innerHTML=idleBox(L)+lwFlat(L);try{misBox(L)}catch(e){console.error(e)}if(poz)try{dayView()}catch(e){}$('meta').textContent=L&&L.at?new Date(L.at).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'načítám…';$('lv').classList.toggle('off',failed>=2)}
$('root').addEventListener('click',e=>{const wb=e.target.closest('#warnb');if(wb&&last){LS.set('dozorWarn',wsig(last,last.summary||{}));render(last);return}const nb=e.target.closest('#newb');if(nb){const fb=$('feedbox');if(fb)fb.scrollTop=0;newCount=0;pauseUntil=Date.now()+8000;if(last)render(last);return}
 if(e.target.closest('#altog')&&!e.target.closest('#ackall')){LS.set('dozorAlOff',!LS.get('dozorAlOff',false));if(last)render(last);return}
 const ch=e.target.closest('.chip');if(ch){if(ch.dataset.act==='roll'){roll=!roll;LS.set('dozorRoll',roll)}else if(ch.dataset.spd){speed=+ch.dataset.spd;LS.set('dozorSpd',speed)}else if(ch.dataset.per){period=+ch.dataset.per;LS.set('dozorPer',period)}else feedF=ch.dataset.f||'';if(last)render(last);return}const c=e.target.closest('.al');if(c){ack.add(c.dataset.id);LS.set('dozorAck',[...ack]);if(last)render(last);return}if(e.target.id==='ackall'){alerts(last).forEach(x=>ack.add(x.id));LS.set('dozorAck',[...ack]);render(last)}});
$('root').addEventListener('toggle',e=>{const n=e.target.dataset&&e.target.dataset.lw;if(!n)return;e.target.open?lwClosed.delete(n):lwClosed.add(n);LS.set('dozorLwClosed',[...lwClosed])},true);
$('root').addEventListener('toggle',e=>{const n=e.target.dataset&&e.target.dataset.ag;if(!n)return;e.target.open?openAg.add(n):openAg.delete(n);LS.set('dozorOpen',[...openAg])},true);
async function load(){left=REFRESH;loadPoz();try{const r=await fetch('/api/agents/dozor',{cache:'no-store'});if(r.status===401){location.reload();return}last=await r.json();failed=0;render(last)}catch(e){failed++;if(last)render(last);else $('meta').textContent='Chyba načtení'}}
$('rf').onclick=load;load();
setInterval(()=>{left--;if(left<=0)load();else if(last)$('lv').title='obnova za '+left+' s';},1000);
setInterval(()=>{flip=!flip;document.title=unacked&&flip?'⚠ '+unacked+' nové – Dozor':(unacked?'('+unacked+') Dozor agentů':'Dozor agentů')},900);
})();
</script></body></html>
